<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>История оценок — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_rated-history.css}">
    <link rel="stylesheet" th:href="@{/css/pages/_history.css}">
</head>
<body class="layout-fixed">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>
<div id="authStatus" th:data-authenticated="${sessionUser.authenticated}" style="display:none;"></div>

<main class="profile-wrapper">
    <div class="profile-grid">
        <th:block th:replace="~{fragments/sidebar :: sidebar(
            currentPage='rated',
            userSidebar=${ratedHistoryPageResponse != null ? ratedHistoryPageResponse.userSidebarViewDTO() : null},
            genres=${ratedHistoryPageResponse != null ? ratedHistoryPageResponse.genres() : null}
        )}"></th:block>

        <div class="profile-right">
            <div class="page-header-row">
                <div class="profile-right-header">
                    <h1>
                        <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                        История оценок
                    </h1>
                </div>
                <th:block th:replace="~{fragments/sort-toggle :: sortToggle}"></th:block>
                <th:block th:replace="~{fragments/catalog-search :: catalogSearch}"></th:block>
            </div>

            <div th:if="${ratedHistoryPageResponse != null and ratedHistoryPageResponse.cursorPageResponse() != null and ratedHistoryPageResponse.cursorPageResponse().items() != null and !ratedHistoryPageResponse.cursorPageResponse().items().isEmpty()}"
                 class="history-container"
                 data-cursor-container
                 data-group-history
                 data-cursor-endpoint="/rated/history/more"
                 data-cursor-template="ratedItemTemplate"
                 th:attr="data-cursor-next=${ratedHistoryPageResponse.cursorPageResponse().nextCursor()},
                          data-cursor-has-more=${ratedHistoryPageResponse.cursorPageResponse().hasMore()},
                          data-cursor-sort=${ratedHistoryPageResponse.cursorPageResponse().sort()},
                          data-cursor-query=${ratedHistoryPageResponse.query()}">

                <div th:each="item : ${ratedHistoryPageResponse.cursorPageResponse().items()}"
                     class="history-item"
                     th:data-movie-id="${item.id()}"
                     th:data-movie-title="${item.title()}"
                     th:data-added-at="${item.addedAt()}">

                    <div class="history-item-icon">
                        <th:block th:replace="~{fragments/icons :: icon-star-filled}"></th:block>
                    </div>

                    <div class="history-item-info"
                         data-action="navigate"
                         th:data-href="@{/movies/{id}(id=${item.id()})}">
                        <a th:href="@{/movies/{id}(id=${item.id()})}"
                           class="history-item-title"
                           th:text="${item.title()}">Название</a>

                        <div class="history-item-meta history-item-meta--rated">
                            <div class="history-item-meta-row history-item-meta-row--genre">
                                <span class="history-item-meta-label">Жанр:</span>
                                <span class="history-item-meta-value"
                                      th:text="${item.genre() != null and !item.genre().isEmpty()} ? ${item.genre()} : '—'">Фантастика</span>
                            </div>

                            <div class="history-item-meta-row history-item-meta-row--review">
                                <span class="history-item-meta-label">Отзыв:</span>
                                <span class="history-item-meta-value"
                                      th:if="${item.review() != null and !#strings.isEmpty(item.review())}"
                                      th:text="${item.review()}">Отличный фильм!</span>
                                <span class="history-item-meta-value history-item-meta-value--muted"
                                      th:if="${item.review() == null or #strings.isEmpty(item.review())}">
                                    — Вы не оставили текстового отзыва —
                                </span>
                            </div>

                            <div class="history-item-meta-row history-item-meta-row--rating">
                                <span class="history-item-meta-label">Оценка:</span>
                                <span class="history-item-meta-value history-item-meta-value--rating">
                                    <span th:text="${item.ratingValue() != null
                                            ? #numbers.formatDecimal(item.ratingValue(), 1, 1).replace('.', ',')
                                            : '—'}">0,0</span>
                                    <span class="history-item-meta-value-max"> / 10</span>
                                    <span class="history-item-rating-star">
                                        <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                                    </span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="history-item-time" th:if="${item.addedAt() != null}">
                        <th:block th:replace="~{fragments/icons :: icon-time}"></th:block>
                        <span>Оценено: <span class="js-local-time" th:data-utc="${item.addedAt()}"></span></span>
                    </div>
                </div>

                <div class="cursor-loader" data-cursor-loader></div>
            </div>

            <div th:if="${ratedHistoryPageResponse == null or ratedHistoryPageResponse.cursorPageResponse() == null or ratedHistoryPageResponse.cursorPageResponse().items() == null or ratedHistoryPageResponse.cursorPageResponse().items().isEmpty()}"
                 class="empty-message">
                <div class="empty-icon">
                    <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                </div>
                <h2>Вы пока не оценили ни один фильм</h2>
                <p>Поставьте оценку фильму — и он появится здесь, чтобы вы могли вернуться к своим впечатлениям.</p>
                <a th:href="@{/}" class="browse-movies-btn">Перейти в главное меню</a>
            </div>

            <th:block th:if="${ratedHistoryPageResponse == null or ratedHistoryPageResponse.cursorPageResponse() == null or ratedHistoryPageResponse.cursorPageResponse().items() == null or ratedHistoryPageResponse.cursorPageResponse().items().isEmpty()}">
                <th:block th:insert="~{fragments/recommendations :: recommendations}"></th:block>
            </th:block>
        </div>
    </div>
</main>

<template id="ratedItemTemplate">
    <div class="history-item" data-attr="data-movie-id:id;data-movie-title:title;data-added-at:addedAt">
        <div class="history-item-icon">
            <th:block th:replace="~{fragments/icons :: icon-star-filled}"></th:block>
        </div>
        <div class="history-item-info" data-action="navigate" data-attr="data-href:/movies/{id}">
            <a class="history-item-title" data-attr="href:/movies/{id}" data-field="title"></a>
            <div class="history-item-meta history-item-meta--rated">
                <div class="history-item-meta-row history-item-meta-row--genre">
                    <span class="history-item-meta-label">Жанр:</span>
                    <span class="history-item-meta-value" data-field="genre"></span>
                </div>
                <div class="history-item-meta-row history-item-meta-row--review">
                    <span class="history-item-meta-label">Отзыв:</span>
                    <span class="history-item-meta-value" data-field="review"></span>
                </div>
                <div class="history-item-meta-row history-item-meta-row--rating">
                    <span class="history-item-meta-label">Оценка:</span>
                    <span class="history-item-meta-value history-item-meta-value--rating">
                        <span data-field="ratingValue"></span>
                        <span class="history-item-meta-value-max"> / 10</span>
                        <span class="history-item-rating-star">
                            <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                        </span>
                    </span>
                </div>
            </div>
        </div>
        <div class="history-item-time">
            <th:block th:replace="~{fragments/icons :: icon-time}"></th:block>
            <span>Оценено: <span class="js-local-time" data-field="addedAtTime"></span></span>
        </div>
    </div>
</template>

<script th:src="@{/js/modules/watched-local-time.js}" defer></script>
<script th:src="@{/js/modules/sort-toggle.js}" defer></script>
<script th:src="@{/js/modules/cursor-pagination.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
