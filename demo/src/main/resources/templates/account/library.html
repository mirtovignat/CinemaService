<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Моя коллекция — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_library.css}">
</head>
<body class="layout-fixed">
<div class="header-wrapper">
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</div>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>
<div id="authStatus" th:data-authenticated="${sessionUser.authenticated}" style="display:none;"></div>

<main class="profile-wrapper">
    <div class="profile-grid">
        <th:block th:replace="~{fragments/sidebar :: sidebar(
            currentPage='library',
            userSidebar=${userSidebarViewDTO},
            genres=${genres}
        )}"></th:block>

        <div class="profile-right">
            <div class="page-header-row">
                <div class="profile-right-header">
                    <h1>
                        <th:block th:replace="~{fragments/icons :: icon-film}"></th:block>
                        Моя коллекция
                    </h1>
                </div>
                <th:block th:replace="~{fragments/sort-toggle :: sortToggle}"></th:block>
                <th:block th:replace="~{fragments/catalog-search :: catalogSearch}"></th:block>
            </div>

            <div th:if="${response != null and response.items() != null and !response.items().isEmpty()}"
                 class="library-container"
                 data-cursor-container
                 data-cursor-endpoint="/library/more"
                 data-cursor-template="libraryCardTemplate"
                 th:attr="data-cursor-next=${response.nextCursor()},
                          data-cursor-has-more=${response.hasMore()},
                          data-cursor-sort=${response.sort()}">

                <div th:each="item : ${response.items()}"
                     class="library-card"
                     th:classappend="${item.watched()} ? 'watched' : ''"
                     th:data-movie-id="${item.id()}"
                     th:data-added-at="${item.addedAt()}">

                    <div class="media-card-poster-link">
                        <a class="poster-link" href="javascript:void(0);"
                           data-action="watch-movie"
                           th:data-movie-id="${item.id()}"
                           th:data-movie-title="${item.title()}"
                           th:data-poster-url="${item.posterUrl()}">
                            <img th:if="${item.posterUrl() != null and !item.posterUrl().isEmpty()}"
                                 th:src="${item.posterUrl()}" alt="Постер"
                                 class="media-card-poster-img" data-poster-img src=""/>
                            <div class="movie-poster-placeholder"
                                 th:classappend="${item.posterUrl() != null and !item.posterUrl().isEmpty()} ? 'hidden' : ''"
                                 data-poster-placeholder>
                                <div class="poster-placeholder-icon">
                                    <th:block th:replace="~{fragments/icons :: icon-image}"></th:block>
                                </div>
                                <div class="poster-placeholder-text">Нет постера</div>
                                <div class="poster-placeholder-sub">Изображение недоступно</div>
                            </div>
                            <th:block th:replace="~{fragments/rating-badge :: ratingBadge(
                                movieId=${item.id()}, rating=${item.rating()})}"></th:block>
                        </a>
                        <div class="poster-overlay">
                            <th:block th:replace="~{fragments/watch-button :: watchButton(
                                movieId=${item.id()}, movieTitle=${item.title()},
                                posterUrl=${item.posterUrl()}, watched=${item.watched()}, variant='md')}"></th:block>
                        </div>
                    </div>

                    <div class="media-card-content">
                        <h3 class="media-card-title">
                            <a th:href="@{/movies/{id}(id=${item.id()})}" th:text="${item.title()}">Название</a>
                        </h3>
                        <div class="media-card-info">
                            <div class="library-info-row" th:if="${item.genre() != null and !item.genre().isEmpty()}">
                                <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-tag}"></th:block></span>
                                <span class="library-info-label">Жанр:</span>
                                <span class="library-info-value" th:text="${item.genre()}">Фантастика</span>
                            </div>
                            <div class="library-info-row" th:if="${item.director() != null and !item.director().isEmpty()}">
                                <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-video}"></th:block></span>
                                <span class="library-info-label">Режиссёр:</span>
                                <span class="library-info-value" th:text="${item.director()}" th:title="${item.director()}">Режиссёр:</span>
                            </div>
                            <div class="library-info-row" th:if="${item.ageRating() != null}">
                                <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-lock}"></th:block></span>
                                <span class="library-info-label">Возрастной рейтинг:</span>
                                <span class="library-info-value" th:text="${item.ageRating()} + '+'">18+</span>
                            </div>
                            <div class="library-info-row" th:if="${item.releaseDate() != null}">
                                <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-calendar}"></th:block></span>
                                <span class="library-info-label">Год выпуска:</span>
                                <span class="library-info-value" th:text="${item.releaseDate().year}">2024</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="cursor-loader" data-cursor-loader></div>
            </div>

            <div th:if="${response == null or response.items() == null or response.items().isEmpty()}"
                 class="empty-message">
                <div class="empty-icon"><th:block th:replace="~{fragments/icons :: icon-film}"></th:block></div>
                <h2>Ваша коллекция пуста</h2>
                <p>Купите первый фильм — и он появится здесь.</p>
                <a th:href="@{/}" class="browse-movies-btn">Перейти в главное меню</a>
            </div>

            <th:block th:if="${response == null or response.items() == null or response.items().isEmpty()}">
                <th:block th:insert="~{fragments/recommendations :: recommendations}"></th:block>
            </th:block>
        </div>
    </div>
</main>

<template id="libraryCardTemplate">
    <div class="library-card"
         data-attr="data-movie-id:id;data-added-at:addedAt">
        <div class="media-card-poster-link">
            <a class="poster-link" href="javascript:void(0);" data-action="watch-movie"
               data-attr="data-movie-id:id;data-movie-title:title;data-poster-url:posterUrl">
                <img class="media-card-poster-img" data-poster-img data-field="posterUrl" src="" alt="Постер"/>
                <div class="movie-poster-placeholder hidden" data-poster-placeholder>
                    <div class="poster-placeholder-icon">
                        <th:block th:replace="~{fragments/icons :: icon-image}"></th:block>
                    </div>
                    <div class="poster-placeholder-text">Нет постера</div>
                    <div class="poster-placeholder-sub">Изображение недоступно</div>
                </div>
            </a>
            <div class="poster-overlay">
                <button class="watch-btn-neon watch-btn-neon--md" type="button" data-action="watch-movie"
                        data-attr="data-movie-id:id;data-movie-title:title;data-poster-url:posterUrl">
                    <th:block th:replace="~{fragments/icons :: icon-play}"></th:block>
                    Смотреть
                </button>
            </div>
        </div>
        <div class="media-card-content">
            <h3 class="media-card-title">
                <a data-attr="href:/movies/{id}" data-field="title"></a>
            </h3>
            <div class="media-card-info">
                <div class="library-info-row">
                    <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-tag}"></th:block></span>
                    <span class="library-info-label">Жанр:</span>
                    <span class="library-info-value" data-field="genre"></span>
                </div>
                <div class="library-info-row">
                    <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-video}"></th:block></span>
                    <span class="library-info-label">Режиссёр:</span>
                    <span class="library-info-value" data-field="director"></span>
                </div>
                <div class="library-info-row">
                    <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-lock}"></th:block></span>
                    <span class="library-info-label">Возрастной рейтинг:</span>
                    <span class="library-info-value"><span data-field="ageRating"></span>+</span>
                </div>
                <div class="library-info-row">
                    <span class="library-info-icon"><th:block th:replace="~{fragments/icons :: icon-calendar}"></th:block></span>
                    <span class="library-info-label">Год выпуска:</span>
                    <span class="library-info-value" data-field="releaseYear"></span>
                </div>
            </div>
        </div>
    </div>
</template>

<script th:src="@{/js/modules/watched-local-time.js}" defer></script>
<script th:src="@{/js/modules/sort-toggle.js}" defer></script>
<script th:src="@{/js/modules/highlight.js}" defer></script>
<script th:src="@{/js/modules/cursor-pagination.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
