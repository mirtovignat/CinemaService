<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Смена пароля — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_change-password.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<main>
    <div class="card">
        <h1>Смена пароля</h1>
        <div th:if="${successMessage}" class="flash-message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-message error" th:text="${errorMessage}"></div>

        <form th:action="@{/settings/change/pwd}" th:object="${passwordChangingDTO}" method="post" id="pwdForm">
            <label for="currentPassword">Текущий пароль</label>
            <div class="input-wrapper">
                <input type="password"
                       th:field="*{currentPassword}"
                       id="currentPassword"
                       required
                       autocomplete="off"
                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error' : ''"/>
                <button type="button" class="toggle-password" data-target="currentPassword">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>
            <div class="error-msg"
                 th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"></div>

            <label for="rawPassword">Новый пароль</label>
            <div class="input-wrapper">
                <input type="password"
                       th:field="*{rawPassword}"
                       id="rawPassword"
                       required
                       autocomplete="off"
                       th:classappend="${#fields.hasErrors('rawPassword')} ? 'has-error' : ''"/>
                <button type="button" class="toggle-password" data-target="rawPassword">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>
            <div id="newPwdError"
                 class="error-msg"
                 th:if="${#fields.hasErrors('rawPassword')}"
                 th:errors="*{rawPassword}"></div>

            <label for="repeatRawPassword">Повторите новый пароль</label>
            <div class="input-wrapper">
                <input type="password"
                       th:field="*{repeatRawPassword}"
                       id="repeatRawPassword"
                       required
                       autocomplete="off"
                       th:classappend="${#fields.hasErrors('repeatRawPassword')} ? 'has-error' : ''"/>
                <button type="button" class="toggle-password" data-target="repeatRawPassword">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>
            <div id="repeatError"
                 class="error-msg"
                 th:if="${#fields.hasErrors('repeatRawPassword')}"
                 th:errors="*{repeatRawPassword}"></div>

            <button type="submit">Изменить пароль</button>
        </form>
        <a href="/personal-account" class="back-link">← Вернуться в личный кабинет</a>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:src="@{/js/pages/page-change-password.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

</body>
</html>
