<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Вход — CinemaService</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: #eef2ff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 0;
            background: radial-gradient(circle at 10% 20%, #0b0f1c, #05070f);
        }
        :root {
            --glass-bg: rgba(18, 25, 45, 0.65);
            --glass-border: rgba(72, 187, 255, 0.25);
            --glow-primary: #3b82f6;
            --glow-success: #10b981;
            --glow-danger: #f43f5e;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
            --shadow-xl: 0 25px 45px -12px rgba(0, 0, 0, 0.5);
            --radius-xl: 28px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            flex: 1 0 auto;
            align-self: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 0;
            padding: clamp(2rem, 5vh, 4rem) 2rem;
            border: 1px solid var(--glass-border);
            border-top: 0;
            border-bottom: 0;
            box-shadow: var(--shadow-xl);
            margin: 0 auto;
        }
        .login-container > * { width: 100%; }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #e0e7ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            justify-content: center;
            width: 100%;
        }
        .logo-link img { width: 28px; height: 28px; border-radius: 10px; }
        label { display: block; margin-top: 0.8rem; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        .input-container { position: relative; width: 100%; margin-bottom: 0.5rem; }
        .clear-input-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            width: 28px;
            height: 28px;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, color 0.18s ease, background 0.18s ease;
            z-index: 2;
        }
        .input-container:has(.toggle-password-btn) .clear-input-btn { right: 42px; }
        .input-container.has-value .clear-input-btn { opacity: 1; pointer-events: auto; }
        .clear-input-btn:hover { color: #e2e8f0; background: rgba(148, 163, 184, 0.12); }
        .clear-input-btn:focus-visible { outline: 2px solid rgba(96, 165, 250, 0.6); outline-offset: 1px; }
        .clear-input-btn svg { width: 16px; height: 16px; }
        input {
            width: 100%;
            padding: 0.8rem 5rem 0.8rem 1rem;
            border-radius: 60px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
        }
        input::placeholder { color: #64748b; opacity: 1; }
        input:focus { outline: none; border-color: var(--glow-primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: white !important;
            caret-color: white !important;
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3) inset !important;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3) inset !important;
            border: 1px solid var(--glass-border) !important;
            transition: background-color 99999s ease-in-out 0s !important;
        }
        input[type="text"], input[type="password"] { background-color: rgba(0,0,0,0.3); }
        button[type="submit"] {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--glow-primary), #1d4ed8);
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }
        .toggle-password-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
        .toggle-password-btn:hover { color: #e2e8f0; }
        .login-footer { text-align: center; margin-top: 1.5rem; }
        .login-footer a { color: #c084fc; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }
        .flash-messages-container { margin-bottom: 1rem; }
        .flash-message {
            padding: 0.8rem 1rem;
            border-radius: 60px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            border-left: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            color: #eef2ff;
        }
        .flash-message.error { border-color: var(--glow-danger); color: #fecdd3; }
        .flash-message.success { border-color: var(--glow-success); color: #a7f3d0; }
        .flash-message.info { border-color: var(--glow-primary); color: #bfdbfe; }
        .close-btn { background: none; border: none; color: inherit; font-size: 1.3rem; cursor: pointer; opacity: 0.7; padding: 0 0 0 10px; }
        .close-btn:hover { opacity: 1; }
        .privacy-note {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.07);
            color: #64748b;
            font-size: 0.74rem;
            line-height: 1.65;
            text-align: center;
        }
        .privacy-note strong { color: #94a3b8; font-weight: 500; }
        .privacy-note a { color: #a78bfa; text-decoration: none; }
        .privacy-note a:hover { text-decoration: underline; }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; height: 0; margin: 0; padding: 0; overflow: hidden; }
        }
        body > footer, body > .footer, body > .page-footer { width: 100%; margin-top: 0; flex: 0 0 auto; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-link">
        <a href="/">
            <img src="/favicon.ico" alt="">
            CinemaService
        </a>
    </div>

    <h1>Вход</h1>

    <div class="flash-messages-container" id="flash-messages-container">
        <div th:if="${successMessage}" class="flash-message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-message error" th:text="${errorMessage}"></div>
        <div th:if="${infoMessage}" class="flash-message info" th:text="${infoMessage}"></div>
        <div th:if="${userNotFoundExceptionMessage}" class="flash-message error" th:text="${userNotFoundExceptionMessage}"></div>
        <div th:if="${invalidPasswordExceptionMessage}" class="flash-message error" th:text="${invalidPasswordExceptionMessage}"></div>
        <div th:if="${exceptionMessage}" class="flash-message error" th:text="${exceptionMessage}"></div>
    </div>

    <form th:action="@{/login}" th:object="${loginForm}" method="post" id="loginForm" autocomplete="on" onsubmit="return prepareLoginSubmit()">
        <input type="hidden" id="identifierType" th:field="*{identifier}" value="USERNAME"/>

        <label for="identifierValue">Username, email или phone</label>
        <div class="input-container">
            <input id="identifierValue"
                   th:field="*{identifierValue}"
                   type="text"
                   placeholder="username, email или +7..."
                   autocomplete="username"
                   required/>
            <button type="button" class="clear-input-btn" aria-label="Очистить поле" title="Очистить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
        </div>

        <label for="loginPassword">Пароль</label>
        <div class="input-container">
            <input id="loginPassword"
                   th:field="*{rawPassword}"
                   type="password"
                   autocomplete="current-password"
                   required
                   minlength="8"/>
            <button type="button" class="clear-input-btn" aria-label="Очистить пароль" title="Очистить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
            <button type="button" id="loginTogglePasswordBtn" onclick="togglePassword()" class="toggle-password-btn" aria-label="Показать пароль">
                <i id="loginPasswordToggleIcon" class="fas fa-eye-slash"></i>
            </button>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="login-footer">
        <a th:href="@{/register}">Создать аккаунт</a>
    </div>

    <div class="privacy-note">
        <strong>Ваши данные остаются конфиденциальными.</strong><br>
        Мы используем их только для входа в CinemaService и не передаём
        третьим лицам без законных оснований. Используя сервис, вы соглашаетесь
        с правилами обработки данных.
    </div>
</div>

<div class="page-footer">
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</div>

<script>
    function prepareLoginSubmit() {
        try { sessionStorage.setItem('justLoggedIn', '1'); } catch (e) {}
        return true;
    }

    function togglePassword() {
        const pwd = document.getElementById('loginPassword');
        const icon = document.getElementById('loginPasswordToggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            pwd.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }

    function detectIdentifierType(value) {
        if (!value || value.trim() === '') return 'USERNAME';
        const trimmed = value.trim();
        if (trimmed.includes('@')) return 'EMAIL';
        if (trimmed.match(/^\+?[\d\s\-()]{7,15}$/)) return 'PHONE';
        return 'USERNAME';
    }

    function disablePasswordClipboard(input) {
        if (!input) return;
        ['copy', 'cut', 'paste', 'drop'].forEach(function(eventName) {
            input.addEventListener(eventName, function(e) { e.preventDefault(); });
        });
        input.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        input.addEventListener('keydown', function(e) {
            const key = (e.key || '').toLowerCase();
            if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x'].includes(key)) e.preventDefault();
            if (e.shiftKey && e.key === 'Insert') e.preventDefault();
        });
    }

    (function clearLoginFormOnLeave() {
        function clearForm() {
            var form = document.getElementById('loginForm');
            if (!form) return;
            form.querySelectorAll('input').forEach(function (input) {
                if (input.type === 'hidden') return;
                input.value = '';
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            });
            var pwd = document.getElementById('loginPassword');
            if (pwd) pwd.type = 'password';
            var icon = document.getElementById('loginPasswordToggleIcon');
            if (icon) {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
            document.querySelectorAll('.input-container.has-value').forEach(function (c) {
                c.classList.remove('has-value');
            });
        }

        window.addEventListener('beforeunload', clearForm);
        window.addEventListener('pageshow', function (e) { if (e.persisted) clearForm(); });
        window.addEventListener('popstate', clearForm);

        if (performance && performance.getEntriesByType) {
            var nav = performance.getEntriesByType('navigation')[0];
            if (nav && nav.type === 'back_forward') clearForm();
        }
    })();

    (function blockBackToLogin() {
        var sessionUser = /*[[${session.sessionUser}]]*/ null;
        var isLoggedIn = sessionUser !== null && sessionUser !== undefined && sessionUser.id !== null;
        if (!isLoggedIn) return;

        function kick() {
            if (window.location.pathname !== '/') {
                window.location.replace('/');
            }
        }

        kick();
        window.addEventListener('pageshow', function (e) { if (e.persisted) kick(); });
        window.addEventListener('DOMContentLoaded', kick);
        window.addEventListener('popstate', kick);
        setInterval(kick, 50);

        if (document.body) document.body.style.visibility = 'hidden';
    })();

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.input-container').forEach(function(container) {
            const input = container.querySelector('input');
            const clearButton = container.querySelector('.clear-input-btn');
            if (!input || !clearButton) return;

            const syncClearButton = function() {
                container.classList.toggle('has-value', input.value.length > 0);
            };

            clearButton.addEventListener('click', function() {
                input.value = '';
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
                input.focus();
                syncClearButton();
            });

            input.addEventListener('input', syncClearButton);
            input.addEventListener('change', syncClearButton);
            syncClearButton();
        });

        disablePasswordClipboard(document.getElementById('loginPassword'));

        const identifierValue = document.getElementById('identifierValue');
        const identifierType = document.getElementById('identifierType');
        if (identifierValue && identifierType) {
            if (identifierValue.value) identifierType.value = detectIdentifierType(identifierValue.value);
            identifierValue.addEventListener('input', function() {
                identifierType.value = detectIdentifierType(this.value);
            });
        }
    });

    setTimeout(() => {
        document.querySelectorAll('#flash-messages-container .flash-message').forEach(msg => {
            setTimeout(() => {
                msg.style.transition = 'opacity 0.5s ease';
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 500);
            }, 5000);
        });
    }, 100);
</script>

</body>
</html>
