<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Вход — CinemaService</title>
    <th:block th:replace="~{fragments/head-minimal :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="auth-page">

<div class="login-container">
    <div class="logo-link">
        <a href="/">
            <img src="/favicon.ico" alt="">
            CinemaService
        </a>
    </div>

    <h1>Вход</h1>

    <div class="flash-messages-container" id="flash-messages-container">
        <div th:if="${param.error}" class="flash-message error">Неверный логин или пароль</div>
        <div th:if="${param.logout}" class="flash-message success">Вы вышли из аккаунта</div>
        <div th:if="${successMessage}" class="flash-message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-message error" th:text="${errorMessage}"></div>
        <div th:if="${infoMessage}" class="flash-message info" th:text="${infoMessage}"></div>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm" autocomplete="on">

        <label for="username">Username, email или телефон</label>
        <div class="input-container">
            <input id="username"
                   name="username"
                   type="text"
                   placeholder="Введите username, email или телефон"
                   autocomplete="username"
                   th:value="${loginForm != null and loginForm.username != null ? loginForm.username : ''}"
                   required/>
            <button type="button" class="clear-input-btn" aria-label="Очистить поле" title="Очистить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
        </div>

        <label for="password">Пароль</label>
        <div class="input-container">
            <input id="password"
                   name="password"
                   type="password"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   required
                   minlength="8"/>
            <button type="button" class="clear-input-btn" aria-label="Очистить пароль" title="Очистить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
            <button type="button"
                    id="loginTogglePasswordBtn"
                    data-action="toggle-login-password"
                    class="toggle-password-btn"
                    aria-label="Показать пароль">
                <i id="loginPasswordToggleIcon" class="fas fa-eye-slash"></i>
            </button>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="login-footer">
        <a th:href="@{/register}">Создать аккаунт</a>
    </div>

    <div class="privacy-note">
        <strong>Ваши данные остаются конфиденциальными.</strong><br>
        Мы используем их только для входа в CinemaService и не передаём
        третьим лицам без законных оснований. Используя сервис, вы соглашаетесь
        с правилами обработки данных.
    </div>
</div>

<div class="page-footer">
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</div>

<script th:src="@{/js/pages/page-login.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

</body>
</html>
