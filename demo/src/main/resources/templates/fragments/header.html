<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Шапка CinemaService</title>
</head>
<body>
<header th:fragment="header" class="site-header">

    <div class="logo-link">
        <a href="/favicon.ico" target="_blank" title="Открыть favicon">
            <img src="/favicon.ico" alt="Favicon">
        </a>
        <a href="/">CinemaService</a>
    </div>

    <div class="search-container">
        <form id="headerSearchForm" action="/" method="get" class="search-form">
            <div class="search-input-wrapper" id="headerSearchWrapper">
            <span class="search-icon">
                <th:block th:replace="~{fragments/icons :: icon-search}"></th:block>
            </span>
                <button type="button"
                        class="filters-inline-btn"
                        id="headerFiltersBtn"
                        aria-label="Фильтры"
                        title="Фильтры">
                    <th:block th:replace="~{fragments/icons :: icon-filter}"></th:block>
                </button>
                <label for="headerSearchInput"
                       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Поиск
                    фильмов</label>
                <input type="text" id="headerSearchInput" name="title" autocomplete="off"
                       placeholder="Поиск фильмов..." maxlength="100"
                       th:value="${param.title != null and !#strings.isEmpty(param.title[0])
                                ? (#strings.length(param.title[0]) > 30
                                    ? #strings.substring(param.title[0], 0, 30) + '…'
                                    : param.title[0])
                                : ''}">

                <button type="button"
                        class="header-search-clear"
                        id="headerSearchClear"
                        aria-label="Очистить поиск"
                        title="Очистить">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         aria-hidden="true">
                        <path d="M7 7l10 10M17 7L7 17"/>
                    </svg>
                </button>

                <span id="headerAutocompleteOverlay"
                      class="search-autocomplete-overlay"
                      aria-hidden="true">
                <span class="typed" id="headerAutocompleteTyped"></span>
                <span class="hint" id="headerAutocompleteHint"></span>
            </span>

                <div id="headerSuggestions" class="header-suggestions"></div>
            </div>
        </form>
        <button type="submit" form="headerSearchForm" class="search-btn search-btn-outside" id="headerSearchSubmitBtn">
            Найти
        </button>
    </div>

    <div class="header-actions">
        <button type="button" class="action-button favourites-btn" id="headerFavouritesBtn"
                title="Избранное">
            <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>
            <span id="favourites-count" class="count-badge"
                  th:text="${favouritesCount != null ? favouritesCount : 0}"
                  th:style="${favouritesCount == null || favouritesCount == 0} ? 'display: none;' : ''">0</span>
        </button>

        <button type="button" class="action-button cart-btn" id="headerCartBtn" title="Корзина">
            <th:block th:replace="~{fragments/icons :: icon-cart}"></th:block>
            <span id="cart-count" class="count-badge"
                  th:text="${cartCount != null ? cartCount : 0}"
                  th:style="${cartCount == null || cartCount == 0} ? 'display: none;' : ''">0</span>
        </button>

        <div th:if="${sessionUser != null}" class="user-menu" id="userMenu">
            <div class="user-menu-toggle" id="userMenuToggle" data-action="toggle-user-menu">
                <div class="user-avatar-letter"
                     th:text="${sessionUser.getFirstUsernameLetter()}"></div>
                <span class="toggle-icon">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                    </svg>
                </span>
            </div>
            <div class="user-dropdown">
                <div class="user-dropdown-header">
                    <div class="user-dropdown-avatar">
                        <div class="user-avatar-letter"
                             th:text="${sessionUser.getFirstUsernameLetter()}"></div>
                    </div>
                    <div class="user-dropdown-info">
                        <div class="user-dropdown-name">
                            <span th:text="${sessionUser.username()}"></span>
                        </div>
                    </div>
                </div>
                <div class="user-dropdown-divider"></div>
                <a th:href="@{/personal-account}" class="user-dropdown-item">
                    <th:block th:replace="~{fragments/icons :: icon-user}"></th:block>
                    Личный кабинет
                </a>
                <a th:href="@{/settings}" class="user-dropdown-item">
                    <th:block th:replace="~{fragments/icons :: icon-settings}"></th:block>
                    Настройки
                </a>
                <div class="user-dropdown-divider"></div>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="user-dropdown-logout">
                        <th:block th:replace="~{fragments/icons :: icon-logout}"></th:block>
                        Выйти
                    </button>
                </form>
                <div class="user-dropdown-divider"></div>
                <div class="account-switcher" id="accountSwitcher"></div>
                <div class="user-dropdown-divider"></div>
                <div class="user-dropdown-add-account" id="userMenuAddAccount">
                    <span>Добавить аккаунт</span>
                </div>
            </div>
        </div>

        <a th:if="${sessionUser == null}" th:href="@{/login}" class="login-button">
            <th:block th:replace="~{fragments/icons :: icon-user}"></th:block>
            Войти
        </a>
    </div>

    <input type="hidden" id="currentUserId"
           th:value="${sessionUser != null ? sessionUser.id() : ''}">

    <div th:if="${sessionUser != null}"
         id="currentUserData"
         th:data-username="${sessionUser.username()}"
         style="display:none;"></div>

    <div id="filtersModalOverlay" class="filters-modal-overlay">
        <div class="filters-modal-content">
            <div class="filters-modal-header">
                <h3>Поиск по фильтрам</h3>
                <button type="button"
                        class="filters-modal-close"
                        id="filtersModalCloseBtn"
                        aria-label="Закрыть">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         aria-hidden="true">
                        <path d="M7 7l10 10M17 7L7 17"/>
                    </svg>
                </button>
            </div>

            <form action="/" method="get" id="filterForm" accept-charset="UTF-8">

                <div class="filter-group">
                    <label for="priceFrom">Цена (₽)</label>
                    <div class="filter-row">
                        <div class="amount-input-with-stepper">
                            <div class="filter-input-with-clear">
                                <input type="text" inputmode="decimal" id="priceFrom" name="priceFrom"
                                       class="filter-input"
                                       placeholder="От 0.01 ₽"
                                       th:value="${param.priceFrom != null ? param.priceFrom[0] : ''}">
                                <button type="button" class="filter-clear-btn" data-clear-target="priceFrom"
                                        aria-label="Очистить" title="Очистить">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.8"
                                         stroke-linecap="round"
                                         aria-hidden="true">
                                        <path d="M7 7l10 10M17 7L7 17"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="stepper-buttons">
                                <button type="button" class="stepper-btn up"
                                        data-stepper-target="priceFrom" data-stepper-delta="0.01"
                                        data-stepper-min="0.01" data-stepper-max="100000" data-stepper-decimals="2"
                                        title="Увеличить" aria-label="Увеличить"></button>
                                <button type="button" class="stepper-btn down"
                                        data-stepper-target="priceFrom" data-stepper-delta="-0.01"
                                        data-stepper-min="0.01" data-stepper-max="100000" data-stepper-decimals="2"
                                        title="Уменьшить" aria-label="Уменьшить"></button>
                            </div>
                        </div>
                        <div class="amount-input-with-stepper">
                            <label for="priceTo"
                                   style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Цена
                                до</label>
                            <div class="filter-input-with-clear">
                                <input type="text" inputmode="decimal" id="priceTo" name="priceTo" class="filter-input"
                                       placeholder="До 100000.00 ₽"
                                       th:value="${param.priceTo != null ? param.priceTo[0] : ''}">
                                <button type="button" class="filter-clear-btn" data-clear-target="priceTo"
                                        aria-label="Очистить" title="Очистить">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.8"
                                         stroke-linecap="round"
                                         aria-hidden="true">
                                        <path d="M7 7l10 10M17 7L7 17"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="stepper-buttons">
                                <button type="button" class="stepper-btn up"
                                        data-stepper-target="priceTo" data-stepper-delta="0.01"
                                        data-stepper-min="0.01" data-stepper-max="100000" data-stepper-decimals="2"
                                        title="Увеличить" aria-label="Увеличить"></button>
                                <button type="button" class="stepper-btn down"
                                        data-stepper-target="priceTo" data-stepper-delta="-0.01"
                                        data-stepper-min="0.01" data-stepper-max="100000" data-stepper-decimals="2"
                                        title="Уменьшить" aria-label="Уменьшить"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="ratingFrom">Рейтинг CinemaService</label>
                    <div class="filter-row">
                        <div class="amount-input-with-stepper">
                            <div class="filter-input-with-clear">
                                <input type="text" inputmode="decimal" id="ratingFrom" name="ratingFrom"
                                       class="filter-input" placeholder="От 0.0"
                                       th:value="${param.ratingFrom != null ? param.ratingFrom[0] : ''}">
                                <button type="button" class="filter-clear-btn" data-clear-target="ratingFrom"
                                        aria-label="Очистить" title="Очистить">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.8"
                                         stroke-linecap="round"
                                         aria-hidden="true">
                                        <path d="M7 7l10 10M17 7L7 17"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="stepper-buttons">
                                <button type="button" class="stepper-btn up"
                                        data-stepper-target="ratingFrom" data-stepper-delta="0.1"
                                        data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                        title="Увеличить" aria-label="Увеличить"></button>
                                <button type="button" class="stepper-btn down"
                                        data-stepper-target="ratingFrom" data-stepper-delta="-0.1"
                                        data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                        title="Уменьшить" aria-label="Уменьшить"></button>
                            </div>
                        </div>
                        <div class="amount-input-with-stepper">
                            <label for="ratingTo"
                                   style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Рейтинг
                                до</label>
                            <div class="filter-input-with-clear">
                                <input type="text" inputmode="decimal" id="ratingTo" name="ratingTo"
                                       class="filter-input"
                                       placeholder="До 10.0"
                                       th:value="${param.ratingTo != null ? param.ratingTo[0] : ''}">
                                <button type="button" class="filter-clear-btn" data-clear-target="ratingTo"
                                        aria-label="Очистить" title="Очистить">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="1.8"
                                         stroke-linecap="round"
                                         aria-hidden="true">
                                        <path d="M7 7l10 10M17 7L7 17"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="stepper-buttons">
                                <button type="button" class="stepper-btn up"
                                        data-stepper-target="ratingTo" data-stepper-delta="0.1"
                                        data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                        title="Увеличить" aria-label="Увеличить"></button>
                                <button type="button" class="stepper-btn down"
                                        data-stepper-target="ratingTo" data-stepper-delta="-0.1"
                                        data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                        title="Уменьшить" aria-label="Уменьшить"></button>
                            </div>
                        </div>
                    </div>
                    <div id="ratingFilterError" class="rating-error"></div>
                </div>

                <div class="filter-group accordion-group">
                    <div class="accordion-trigger" data-target="directorsDropdown">
                        <span>Режиссёр</span>
                        <span class="accordion-caret" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                            </svg>
                        </span>
                    </div>
                    <div class="accordion-dropdown" id="directorsDropdown"></div>
                </div>

                <div class="filter-group accordion-group">
                    <div class="accordion-trigger" data-target="genresDropdown">
                        <span>Жанр кино</span>
                        <span class="accordion-caret" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                            </svg>
                        </span>
                    </div>
                    <div class="accordion-dropdown" id="genresDropdown"></div>
                </div>

                <div class="filter-group">
                    <label for="releaseDateFrom">Дата выхода</label>
                    <div class="filter-row">
                        <div class="filter-input-with-clear">
                            <input type="date" id="releaseDateFrom" name="releaseDateFrom" class="filter-input"
                                   th:value="${param.releaseDateFrom != null ? param.releaseDateFrom[0] : ''}"
                                   th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            <button type="button" class="filter-clear-btn" data-clear-target="releaseDateFrom"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8"
                                     stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                        <label for="releaseDateTo"
                               style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Дата
                            выхода до</label>
                        <div class="filter-input-with-clear">
                            <input type="date" id="releaseDateTo" name="releaseDateTo" class="filter-input"
                                   th:value="${param.releaseDateTo != null ? param.releaseDateTo[0] : ''}"
                                   th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            <button type="button" class="filter-clear-btn" data-clear-target="releaseDateTo"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8"
                                     stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Длительность</label>
                    <div class="duration-range-inline">
                        <div class="duration-block">
                            <span class="range-prefix">От</span>
                            <div class="duration-picker">
                                <div class="duration-field">
                                    <label for="durationFromHours"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Часы
                                        от</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationFromHours" class="filter-input positive-int"
                                               placeholder="0" data-max="16" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">ч.</span>
                                    </div>
                                </div>
                                <div class="duration-field">
                                    <label for="durationFromMinutes"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Минуты
                                        от</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationFromMinutes" class="filter-input positive-int"
                                               placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">мин.</span>
                                    </div>
                                </div>
                                <div class="duration-field">
                                    <label for="durationFromSeconds"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Секунды
                                        от</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationFromSeconds" class="filter-input positive-int"
                                               placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">сек.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <span class="range-separator">—</span>
                        <div class="duration-block">
                            <span class="range-prefix">До</span>
                            <div class="duration-picker">
                                <div class="duration-field">
                                    <label for="durationToHours"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Часы
                                        до</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationToHours" class="filter-input positive-int"
                                               placeholder="0" data-max="16" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">ч.</span>
                                    </div>
                                </div>
                                <div class="duration-field">
                                    <label for="durationToMinutes"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Минуты
                                        до</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationToMinutes" class="filter-input positive-int"
                                               placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">мин.</span>
                                    </div>
                                </div>
                                <div class="duration-field">
                                    <label for="durationToSeconds"
                                           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Секунды
                                        до</label>
                                    <div class="duration-input-wrapper">
                                        <input type="text" id="durationToSeconds" class="filter-input positive-int"
                                               placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                               autocomplete="off">
                                        <span class="unit">сек.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="minDuration" name="durationFrom"
                           th:value="${param.durationFrom != null ? param.durationFrom[0] : ''}">
                    <input type="hidden" id="maxDuration" name="durationTo"
                           th:value="${param.durationTo != null ? param.durationTo[0] : ''}">
                </div>

                <div class="filters-modal-footer">
                    <button type="submit" class="btn btn-primary">Применить и найти</button>
                    <button type="button" class="btn btn-secondary" id="filtersResetBtn">Сброс</button>
                </div>
            </form>
        </div>
    </div>

</header>

</body>
</html>
