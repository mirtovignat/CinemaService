<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body>

<div th:fragment="grid(response)">

    <div class="movies-grid"
         th:if="${response.cardsPage() != null and !response.cardsPage().empty}">

        <div class="movie-card"
             th:each="movie : ${response.cardsPage().content}"
             th:data-movie-id="${movie.movie.id}"
             th:data-movie-title="${movie.movie.title}"
             th:data-movie-price="${movie.movie.price}">

            <a class="movie-poster-link"
               th:href="@{/movies/{id}(id=${movie.movie.id})}">

                <span class="poster-rating-badge js-rating-badge"
                      th:data-movie-id="${movie.movie.id}"
                      th:text="${movie.movie.rating != null ? '★ ' + #numbers.formatDecimal(movie.movie.rating, 1, 1) : '★ —'}">
                    ★ 3.0
                </span>

                <img th:if="${movie.movie.posterUrl != null and !movie.movie.posterUrl.isEmpty()}"
                     th:src="${movie.movie.posterUrl}"
                     alt="Постер"
                     class="movie-poster-img"
                     data-poster-img
                     src=""/>

                <div class="movie-poster-placeholder"
                     th:classappend="${movie.movie.posterUrl != null and !movie.movie.posterUrl.isEmpty()} ? 'hidden' : ''"
                     data-poster-placeholder>
                    <span>Постер</span>
                </div>

                <span class="poster-duration"
                      th:if="${movie.movie.formattedDuration != null and !movie.movie.formattedDuration.isEmpty()}">

                    <th:block th:replace="~{fragments/icons :: icon-clock}"></th:block>

                    <span th:text="${movie.movie.formattedDuration}">
                        1:40:00
                    </span>
                </span>

                <div class="poster-overlay"
                     th:if="${sessionUser != null and movie.status.bought}">

                    <button type="button"
                            class="watch-btn-neon watch-btn-neon--md"
                            data-action="watch-movie"
                            th:data-movie-id="${movie.movie.id}"
                            th:data-movie-title="${movie.movie.title}"
                            th:data-poster-url="${movie.movie.posterUrl}">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>

                        Смотреть
                    </button>
                </div>
            </a>

            <div class="movie-card-content">

                <h3 class="movie-card-title">

                    <a th:href="@{/movies/{id}(id=${movie.movie.id})}"
                       th:text="${movie.movie.title}">
                        Название
                    </a>

                </h3>

                <div class="badges">

                    <span class="badge director"
                          th:if="${movie.movie.director != null and !movie.movie.director.isEmpty()}">

                        <th:block th:replace="~{fragments/icons :: icon-video}"></th:block>

                        <span class="badge-text">

                            <span class="badge-label">
                                Режиссёр:
                            </span>

                            <span class="badge-value"
                                  th:text="${movie.movie.director}">
                                Гай Ричи
                            </span>

                        </span>
                    </span>

                    <span class="badge year"
                          th:if="${movie.movie.releaseDate != null}">

                        <th:block th:replace="~{fragments/icons :: icon-calendar}"></th:block>

                        <span class="badge-text">

                            <span class="badge-label">
                                Год:
                            </span>

                            <span class="badge-value"
                                  th:text="${movie.movie.releaseDate.year}">
                                2024
                            </span>

                        </span>
                    </span>

                    <span class="badge genre"
                          th:if="${movie.movie.genre != null and !movie.movie.genre.isEmpty()}">

                        <th:block th:replace="~{fragments/icons :: icon-tag}"></th:block>

                        <span class="badge-text">

                            <span class="badge-label">
                                Жанр:
                            </span>

                            <span class="badge-value"
                                  th:text="${movie.movie.genre}">
                                Комедия
                            </span>

                        </span>
                    </span>

                    <span class="badge age"
                          th:if="${movie.movie.ageRating != null}">

                        <th:block th:replace="~{fragments/icons :: icon-lock}"></th:block>

                        <span class="badge-text">

                            <span class="badge-label">
                                Возрастной рейтинг:
                            </span>

                            <span class="badge-value"
                                  th:text="${movie.movie.ageRating} + '+'">
                                18+
                            </span>

                        </span>
                    </span>

                </div>

                <div class="price">

                    <th:block th:replace="~{fragments/icons :: icon-money}"></th:block>

                    <span>
                        Цена:
                    </span>

                    <span th:text="${movie.movie.price} + ' ₽'">
                        100 ₽
                    </span>

                </div>

                <div class="movie-actions">

                    <button type="button"
                            class="icon-btn favourite-btn"
                            th:classappend="${movie.status.inFavourites} ? 'active' : ''"
                            data-action="toggle-favourite"
                            th:data-movie-id="${movie.movie.id}"
                            th:data-movie-title="${movie.movie.title}"
                            th:data-state="${movie.status.inFavourites} ? 'remove' : 'add'"
                            title="Избранное">

                        <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>

                    </button>

                    <button type="button"
                            class="icon-btn rating-btn"
                            data-action="show-rating"
                            th:data-movie-id="${movie.movie.id}"
                            th:data-movie-title="${movie.movie.title}"
                            title="Оценить">

                        <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>

                    </button>

                    <a th:href="@{/rated/{id}/reviews(id=${movie.movie.id})}"
                       class="icon-btn comment-btn"
                       title="Отзывы">

                        <th:block th:replace="~{fragments/icons :: icon-comments}"></th:block>

                        <span class="reviews-count-text"
                              th:data-movie-id="${movie.movie.id}"
                              th:text="'Отзывы: ' + ${movie.movie.ratingsCount != null ? movie.movie.ratingsCount : 0} + ' шт.'">
                            Отзывы: 0 шт.
                        </span>

                    </a>

                </div>

                <div class="purchase-buttons">

                    <th:block th:if="${sessionUser != null}">

                        <button type="button"
                                th:if="${!movie.status.bought and !movie.status.inCart}"
                                class="cart-button to-cart-btn-details"
                                data-action="add-to-cart"
                                th:data-movie-id="${movie.movie.id}"
                                th:data-movie-title="${movie.movie.title}"
                                th:data-movie-price="${movie.movie.price}">
                            В корзину
                        </button>

                        <a th:if="${movie.status.inCart}"
                           th:href="@{/cart(highlight=${movie.movie.id})}"
                           class="cart-button in-cart-btn-details">
                            В корзине → Перейти
                        </a>

                        <button type="button"
                                th:if="${!movie.status.bought}"
                                class="buy-now-btn"
                                data-action="buy-now"
                                th:data-movie-id="${movie.movie.id}"
                                th:data-movie-title="${movie.movie.title}"
                                th:data-movie-price="${movie.movie.price}">
                            Купить сейчас
                        </button>

                        <a th:if="${movie.status.bought}"
                           th:href="@{/library(highlight=${movie.movie.id})}"
                           class="bought-btn">
                            Куплено → К коллекции
                        </a>

                    </th:block>

                    <th:block th:unless="${sessionUser != null}">

                        <button type="button"
                                class="cart-button to-cart-btn-details"
                                data-action="add-to-cart"
                                th:data-movie-id="${movie.movie.id}"
                                th:data-movie-title="${movie.movie.title}"
                                th:data-movie-price="${movie.movie.price}">
                            В корзину
                        </button>

                        <button type="button"
                                class="buy-now-btn"
                                data-action="buy-now"
                                th:data-movie-id="${movie.movie.id}"
                                th:data-movie-title="${movie.movie.title}"
                                th:data-movie-price="${movie.movie.price}">
                            Купить сейчас
                        </button>

                    </th:block>

                </div>

            </div>
        </div>
    </div>

    <div class="empty-catalog"
         th:unless="${response.cardsPage() != null and !response.cardsPage().empty}">

        <h2 th:if="${response.isSearch()}"
            style="color: #a78bfa; text-align: center;">
            По вашему запросу ничего не найдено
        </h2>

        <h2 th:unless="${response.isSearch()}"
            style="color: #94a3b8; text-align: center;">
            Фильмы не найдены
        </h2>

        <p class="text-muted text-center"
           th:if="${response.isSearch()}">
            Попробуйте изменить параметры поиска.
        </p>

        <a th:if="${response.isSearch()}"
           href="/"
           class="browse-movies-btn"
           style="display: block; width: fit-content; margin: 1.5rem auto;">
            Вернуться в каталог
        </a>

    </div>

</div>

</body>
</html>
