<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<div th:fragment="sortToggle" class="sort-toggle-wrapper">
    <div class="sort-toggle-group" id="sortToggleGroup">
        <button type="button"
                class="sort-option"
                data-order="desc">Сначала новые
        </button>
        <button type="button"
                class="sort-option"
                data-order="asc">Сначала старые
        </button>
    </div>
</div>

</body>
</html>
