<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<div th:fragment="watchedModals">

    <div id="watchedRemoveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                    Удалить из истории?
                </h3>
                <button type="button" class="modal-x"
                        data-action="close-delete-item-modal" aria-label="Закрыть">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" aria-hidden="true">
                        <path d="M7 7l10 10M17 7L7 17"/>
                    </svg>
                </button>
            </div>
            <p>Вы уверены, что хотите удалить фильм
                <strong id="deleteItemTitle" style="color:#e2e8f0;"></strong>
                из истории просмотров?
            </p>
            <div class="modal-buttons">
                <button class="modal-confirm-btn danger"
                        type="button"
                        id="confirmDeleteItemBtn"
                        data-action="confirm-delete-history-item">Удалить
                </button>
            </div>
        </div>
    </div>

    <div id="watchedClearModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                    Удалить историю просмотров?
                </h3>
                <button type="button" class="modal-x"
                        data-action="close-clear-history-modal" aria-label="Закрыть">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" aria-hidden="true">
                        <path d="M7 7l10 10M17 7L7 17"/>
                    </svg>
                </button>
            </div>
            <p>Вся ваша история просмотров будет безвозвратно удалена.</p>
            <p style="color:#94a3b8; font-size:0.85rem;">Это действие нельзя отменить.</p>
            <div class="modal-buttons">
                <button class="modal-confirm-btn danger"
                        type="button"
                        data-action="confirm-clear-history">Удалить всё
                </button>
            </div>
        </div>
    </div>

</div>

</body>
</html>
