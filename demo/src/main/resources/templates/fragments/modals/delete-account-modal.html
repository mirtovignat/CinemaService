<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>
<div th:fragment="deleteAccountModal" id="deleteAccountModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Удаление аккаунта</h3>
            <button class="modal-x"
                    type="button"
                    data-action="close-delete-account-modal"
                    aria-label="Закрыть">
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     aria-hidden="true">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
        </div>
        <p>Вы уверены, что хотите удалить аккаунт?</p>
        <p style="color:#f87171; font-weight:600; margin-top:-0.5rem;">
            Это действие необратимо.
        </p>
        <p style="color:#94a3b8; font-size:0.9rem;">
            Все покупки, оценки, избранное и история просмотров будут утеряны.
        </p>
        <div class="modal-buttons">
            <button class="modal-cancel-btn"
                    type="button"
                    data-action="close-delete-account-modal">Отмена
            </button>
            <button class="modal-confirm-btn danger"
                    type="button"
                    data-action="confirm-delete-account">Удалить аккаунт
            </button>
        </div>
        <form th:action="@{/profile/delete}" method="post" id="deleteAccountForm" style="display:none;"></form>
    </div>
</div>
</body>
</html>
