<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<div th:fragment="favouritesModals">

    <div id="favouritesRemoveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                    Удаление из избранного
                </h3>
                <button type="button" class="modal-x" data-modal-close aria-label="Закрыть">
                    <th:block th:replace="~{fragments/icons :: icon-x}"></th:block>
                </button>
            </div>
            <p>Вы уверены, что хотите удалить фильм из избранного?</p>
            <p style="font-weight:600; color:#e2e8f0;" data-modal-movie-title></p>
            <div class="modal-buttons">
                <button type="button" class="modal-confirm-btn danger" data-modal-confirm>
                    Удалить
                </button>
            </div>
        </div>
    </div>

    <div id="favouritesClearModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                    Очистка избранного
                </h3>
                <button type="button" class="modal-x" data-modal-close aria-label="Закрыть">
                    <th:block th:replace="~{fragments/icons :: icon-x}"></th:block>
                </button>
            </div>
            <p>Вы уверены, что хотите удалить все фильмы из избранного?</p>
            <p style="color:#94a3b8; font-size:0.85rem;">Это действие нельзя отменить.</p>
            <div class="modal-buttons">
                <button type="button" class="modal-confirm-btn danger" data-modal-confirm>
                    Очистить избранное
                </button>
            </div>
        </div>
    </div>

</div>

</body>
</html>
