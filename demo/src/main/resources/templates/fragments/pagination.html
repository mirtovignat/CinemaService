<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body>

<div th:fragment="pager(page, url)"
     class="pagination"
     th:if="${page != null and page.totalPages > 1}"
     th:with="currentPage=${page.number}, totalPages=${page.totalPages}">

    <th:block th:with="
        queryString=${
            (param.title != null and param.title[0] != '' ? '&title=' + #uris.escapeQueryParam(param.title[0]) : '') +
            (param.genre != null and param.genre[0] != '' ? '&genre=' + #uris.escapeQueryParam(param.genre[0]) : '') +
            (param.priceFrom != null and param.priceFrom[0] != '' ? '&priceFrom=' + #uris.escapeQueryParam(param.priceFrom[0]) : '') +
            (param.priceTo != null and param.priceTo[0] != '' ? '&priceTo=' + #uris.escapeQueryParam(param.priceTo[0]) : '') +
            (param.ratingFrom != null and param.ratingFrom[0] != '' ? '&ratingFrom=' + #uris.escapeQueryParam(param.ratingFrom[0]) : '') +
            (param.ratingTo != null and param.ratingTo[0] != '' ? '&ratingTo=' + #uris.escapeQueryParam(param.ratingTo[0]) : '') +
            (param.durationFrom != null and param.durationFrom[0] != '' ? '&durationFrom=' + #uris.escapeQueryParam(param.durationFrom[0]) : '') +
            (param.durationTo != null and param.durationTo[0] != '' ? '&durationTo=' + #uris.escapeQueryParam(param.durationTo[0]) : '') +
            (param.releaseDateFrom != null and param.releaseDateFrom[0] != '' ? '&releaseDateFrom=' + #uris.escapeQueryParam(param.releaseDateFrom[0]) : '') +
            (param.releaseDateTo != null and param.releaseDateTo[0] != '' ? '&releaseDateTo=' + #uris.escapeQueryParam(param.releaseDateTo[0]) : '') +
            (param.genres != null and param.genres.length > 0 ? '&genres=' + #uris.escapeQueryParam(#strings.listJoin(param.genres, ',')) : '') +
            (param.directors != null and param.directors.length > 0 ? '&directors=' + #uris.escapeQueryParam(#strings.listJoin(param.directors, ',')) : '') +
            (param.actors != null and param.actors.length > 0 ? '&actors=' + #uris.escapeQueryParam(#strings.listJoin(param.actors, ',')) : '') +
            (param.sortBy != null and param.sortBy[0] != '' ? '&sortBy=' + #uris.escapeQueryParam(param.sortBy[0]) : '') +
            (param.sortDirection != null and param.sortDirection[0] != '' ? '&sortDirection=' + #uris.escapeQueryParam(param.sortDirection[0]) : '')
        },
        baseUrl=${url + '?page='}
    ">

        <th:block th:if="${currentPage > 0}">
            <a th:href="${baseUrl + (currentPage - 1) + queryString}" class="page-nav">
                <th:block th:replace="~{fragments/icons :: icon-chevron-left}"></th:block>
            </a>
        </th:block>

        <th:block th:if="${totalPages <= 7}">
            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="${baseUrl + i + queryString}"
                   class="page-nav"
                   th:classappend="${i == currentPage} ? 'active' : ''"
                   th:text="${i + 1}"></a>
            </th:block>
        </th:block>

        <th:block th:unless="${totalPages <= 7}">

            <a th:href="${baseUrl + '0' + queryString}"
               class="page-nav"
               th:classappend="${currentPage == 0} ? 'active' : ''">1</a>

            <span th:if="${currentPage >= 4}" class="page-dots">…</span>

            <th:block th:with="
                startPage=${currentPage <= 3 ? 1 : (currentPage >= totalPages - 4 ? totalPages - 5 : currentPage - 1)},
                endPage=${currentPage <= 3 ? 5 : (currentPage >= totalPages - 4 ? totalPages - 2 : currentPage + 1)}
            ">
                <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                    <a th:if="${i > 0 and i < totalPages - 1}"
                       th:href="${baseUrl + i + queryString}"
                       class="page-nav"
                       th:classappend="${i == currentPage} ? 'active' : ''"
                       th:text="${i + 1}"></a>
                </th:block>
            </th:block>

            <span th:if="${currentPage < totalPages - 4}" class="page-dots">…</span>

            <a th:href="${baseUrl + (totalPages - 1) + queryString}"
               class="page-nav"
               th:classappend="${currentPage == totalPages - 1} ? 'active' : ''"
               th:text="${totalPages}"></a>
        </th:block>

        <th:block th:if="${currentPage < totalPages - 1}">
            <a th:href="${baseUrl + (currentPage + 1) + queryString}" class="page-nav">
                <th:block th:replace="~{fragments/icons :: icon-chevron-right}"></th:block>
            </a>
        </th:block>

    </th:block>

</div>

</body>
</html>
