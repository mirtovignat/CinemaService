<div th:fragment="flashMessages" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="flash-messages-container" id="flash-messages-container">
        <div th:if="${successMessage}" class="flash-message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="flash-message error" th:text="${errorMessage}"></div>
        <div th:if="${infoMessage}" class="flash-message info" th:text="${infoMessage}"></div>
    </div>

    <script>
        (function () {
            const container = document.getElementById('flash-messages-container');
            if (!container) return;

            const messages = Array.from(container.querySelectorAll('.flash-message'));
            if (messages.length === 0) return;

            messages.forEach((m, i) => {
                if (i > 0) m.style.display = 'none';
            });

            let index = 0;

            function showNext() {
                const current = messages[index];
                if (!current) return;

                current.style.display = '';

                setTimeout(() => {
                    if (!current.parentNode) {
                        index++;
                        showNext();
                        return;
                    }

                    current.setAttribute('data-leaving', 'true');
                    current.style.animation = 'flashVanish 0.3s ease forwards';
                    setTimeout(() => {
                        current.remove();
                        index++;
                        showNext();
                    }, 320);
                }, 2000);
            }

            showNext();
        })();
    </script>
</div>
