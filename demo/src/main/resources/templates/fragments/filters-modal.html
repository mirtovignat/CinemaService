<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<div th:fragment="filtersModal" id="filtersModalOverlay" class="filters-modal-overlay">
    <div class="filters-modal-content">
        <div class="filters-modal-header">
            <h3>Поиск по фильтрам</h3>
            <button type="button"
                    class="filters-modal-close"
                    id="filtersModalCloseBtn"
                    aria-label="Закрыть">
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     aria-hidden="true">
                    <path d="M7 7l10 10M17 7L7 17"/>
                </svg>
            </button>
        </div>

        <form id="filterForm" accept-charset="UTF-8" onsubmit="return false;">

            <div class="filter-group sort-filter-group">
                <div class="sort-filter-row">
                    <span class="sort-filter-label">Отсортировать по цене:</span>
                    <div class="sort-filter-options" role="group" aria-label="Сортировка по цене">
                        <button type="button" class="sort-filter-btn" data-sort-key="price" data-sort-dir="asc">Возр.</button>
                        <button type="button" class="sort-filter-btn" data-sort-key="price" data-sort-dir="desc">Убыв.</button>
                    </div>
                </div>
                <div class="sort-filter-row">
                    <span class="sort-filter-label">Отсортировать по длительности:</span>
                    <div class="sort-filter-options" role="group" aria-label="Сортировка по длительности">
                        <button type="button" class="sort-filter-btn" data-sort-key="duration" data-sort-dir="asc">Возр.</button>
                        <button type="button" class="sort-filter-btn" data-sort-key="duration" data-sort-dir="desc">Убыв.</button>
                    </div>
                </div>
                <div class="sort-filter-row">
                    <span class="sort-filter-label">Отсортировать по рейтингу:</span>
                    <div class="sort-filter-options" role="group" aria-label="Сортировка по рейтингу">
                        <button type="button" class="sort-filter-btn" data-sort-key="rating" data-sort-dir="asc">Возр.</button>
                        <button type="button" class="sort-filter-btn" data-sort-key="rating" data-sort-dir="desc">Убыв.</button>
                    </div>
                </div>
                <div class="sort-filter-row">
                    <span class="sort-filter-label">Отсортировать по дате выхода:</span>
                    <div class="sort-filter-options" role="group" aria-label="Сортировка по дате выхода">
                        <button type="button" class="sort-filter-btn" data-sort-key="releaseDate" data-sort-dir="asc">Возр.</button>
                        <button type="button" class="sort-filter-btn" data-sort-key="releaseDate" data-sort-dir="desc">Убыв.</button>
                    </div>
                </div>
                <input type="hidden" id="filterSortBy" name="sortBy"
                       th:value="${param.sortBy != null ? param.sortBy[0] : ''}">
                <input type="hidden" id="filterSortDirection" name="sortDirection"
                       th:value="${param.sortDirection != null ? param.sortDirection[0] : ''}">
            </div>

            <div class="filter-group">
                <div class="filter-row">
                    <div class="amount-input-with-stepper">
                        <label for="priceFrom" class="filter-sublabel">Цена (От):</label>
                        <div class="filter-input-with-clear">
                            <input type="text" inputmode="decimal" id="priceFrom" name="priceFrom"
                                   class="filter-input"
                                   placeholder="0.01 ₽"
                                   th:value="${param.priceFrom != null ? param.priceFrom[0] : ''}">
                            <button type="button" class="filter-clear-btn" data-clear-target="priceFrom"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="amount-input-with-stepper">
                        <label for="priceTo" class="filter-sublabel">Цена (До):</label>
                        <div class="filter-input-with-clear">
                            <input type="text" inputmode="decimal" id="priceTo" name="priceTo" class="filter-input"
                                   placeholder="100000 ₽"
                                   th:value="${param.priceTo != null ? param.priceTo[0] : ''}">
                            <button type="button" class="filter-clear-btn" data-clear-target="priceTo"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-row">
                    <div class="amount-input-with-stepper">
                        <label for="ratingFrom" class="filter-sublabel">Рейтинг (От):</label>
                        <div class="filter-input-with-clear">
                            <input type="text" inputmode="decimal" id="ratingFrom" name="ratingFrom"
                                   class="filter-input" placeholder="0.0"
                                   th:value="${param.ratingFrom != null ? param.ratingFrom[0] : ''}">
                            <button type="button" class="filter-clear-btn" data-clear-target="ratingFrom"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                        <div class="stepper-buttons">
                            <button type="button" class="stepper-btn up"
                                    data-stepper-target="ratingFrom" data-stepper-delta="0.1"
                                    data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                    title="Увеличить" aria-label="Увеличить"></button>
                            <button type="button" class="stepper-btn down"
                                    data-stepper-target="ratingFrom" data-stepper-delta="-0.1"
                                    data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                    title="Уменьшить" aria-label="Уменьшить"></button>
                        </div>
                    </div>
                    <div class="amount-input-with-stepper">
                        <label for="ratingTo" class="filter-sublabel">Рейтинг (До):</label>
                        <div class="filter-input-with-clear">
                            <input type="text" inputmode="decimal" id="ratingTo" name="ratingTo"
                                   class="filter-input"
                                   placeholder="10.0"
                                   th:value="${param.ratingTo != null ? param.ratingTo[0] : ''}">
                            <button type="button" class="filter-clear-btn" data-clear-target="ratingTo"
                                    aria-label="Очистить" title="Очистить">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                     aria-hidden="true">
                                    <path d="M7 7l10 10M17 7L7 17"/>
                                </svg>
                            </button>
                        </div>
                        <div class="stepper-buttons">
                            <button type="button" class="stepper-btn up"
                                    data-stepper-target="ratingTo" data-stepper-delta="0.1"
                                    data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                    title="Увеличить" aria-label="Увеличить"></button>
                            <button type="button" class="stepper-btn down"
                                    data-stepper-target="ratingTo" data-stepper-delta="-0.1"
                                    data-stepper-min="0" data-stepper-max="10" data-stepper-decimals="1"
                                    title="Уменьшить" aria-label="Уменьшить"></button>
                        </div>
                    </div>
                </div>
                <div id="ratingFilterError" class="rating-error"></div>
            </div>

            <div class="filter-group accordion-group" data-accordion="directors">
                <div class="accordion-trigger" data-target="directorsDropdown">
                    <span>Режиссёр</span>
                    <span class="accordion-caret" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                        </svg>
                    </span>
                </div>
                <div class="accordion-dropdown" id="directorsDropdown" data-accordion-dropdown>
                    <div class="accordion-search" data-accordion-search-wrapper>
                        <span class="accordion-search-icon">
                            <th:block th:replace="~{fragments/icons :: icon-search}"></th:block>
                        </span>
                        <input type="text"
                               class="accordion-search-input"
                               placeholder="Поиск режиссёра..."
                               autocomplete="off"
                               maxlength="100"
                               data-accordion-search-input
                               aria-label="Поиск режиссёра">
                        <button type="button"
                                class="accordion-search-clear"
                                data-accordion-search-clear
                                aria-label="Очистить поиск"
                                title="Очистить">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                 aria-hidden="true">
                                <path d="M7 7l10 10M17 7L7 17"/>
                            </svg>
                        </button>
                    </div>
                    <div class="accordion-list" data-accordion-list></div>
                    <div class="accordion-empty" data-accordion-empty>Ничего не найдено</div>
                </div>
            </div>

            <div class="filter-group">
                <label for="actorsInput" class="filter-sublabel">Актёры (через запятую):</label>
                <div class="filter-input-with-clear">
                    <input type="text"
                           id="actorsInput"
                           name="actors"
                           class="filter-input"
                           placeholder="Киану Ривз, Лоренс Фишбёрн"
                           autocomplete="off"
                           maxlength="500"
                           th:value="${param.actors != null and param.actors.length > 0 ? #strings.listJoin(param.actors, ', ') : ''}">
                    <button type="button" class="filter-clear-btn" data-clear-target="actorsInput"
                            aria-label="Очистить" title="Очистить">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                             aria-hidden="true">
                            <path d="M7 7l10 10M17 7L7 17"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="filter-group accordion-group" data-accordion="genres">
                <div class="accordion-trigger" data-target="genresDropdown">
                    <span>Жанр кино</span>
                    <span class="accordion-caret" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                        </svg>
                    </span>
                </div>
                <div class="accordion-dropdown" id="genresDropdown" data-accordion-dropdown>
                    <div class="accordion-search" data-accordion-search-wrapper>
                        <span class="accordion-search-icon">
                            <th:block th:replace="~{fragments/icons :: icon-search}"></th:block>
                        </span>
                        <input type="text"
                               class="accordion-search-input"
                               placeholder="Поиск жанра..."
                               autocomplete="off"
                               maxlength="100"
                               data-accordion-search-input
                               aria-label="Поиск жанра">
                        <button type="button"
                                class="accordion-search-clear"
                                data-accordion-search-clear
                                aria-label="Очистить поиск"
                                title="Очистить">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                 aria-hidden="true">
                                <path d="M7 7l10 10M17 7L7 17"/>
                            </svg>
                        </button>
                    </div>
                    <div class="accordion-list" data-accordion-list></div>
                    <div class="accordion-empty" data-accordion-empty>Ничего не найдено</div>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-row">
                    <div class="filter-input-with-clear">
                        <label for="releaseDateFrom" class="filter-sublabel">Дата выхода (От):</label>
                        <input type="date" id="releaseDateFrom" name="releaseDateFrom" class="filter-input"
                               th:value="${param.releaseDateFrom != null ? param.releaseDateFrom[0] : ''}"
                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        <button type="button" class="filter-clear-btn" data-clear-target="releaseDateFrom"
                                aria-label="Очистить" title="Очистить">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                 aria-hidden="true">
                                <path d="M7 7l10 10M17 7L7 17"/>
                            </svg>
                        </button>
                    </div>
                    <div class="filter-input-with-clear">
                        <label for="releaseDateTo" class="filter-sublabel">Дата выхода (До):</label>
                        <input type="date" id="releaseDateTo" name="releaseDateTo" class="filter-input"
                               th:value="${param.releaseDateTo != null ? param.releaseDateTo[0] : ''}"
                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        <button type="button" class="filter-clear-btn" data-clear-target="releaseDateTo"
                                aria-label="Очистить" title="Очистить">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                 aria-hidden="true">
                                <path d="M7 7l10 10M17 7L7 17"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <div class="duration-range-inline">
                    <div class="duration-block">
                        <span class="range-prefix">Длительность (От):</span>
                        <div class="duration-picker">
                            <div class="duration-field">
                                <label for="durationFromHours" class="visually-hidden">Часы от</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationFromHours" class="filter-input positive-int"
                                           placeholder="0" data-max="16" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">ч.</span>
                                </div>
                            </div>
                            <div class="duration-field">
                                <label for="durationFromMinutes" class="visually-hidden">Минуты от</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationFromMinutes" class="filter-input positive-int"
                                           placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">мин.</span>
                                </div>
                            </div>
                            <div class="duration-field">
                                <label for="durationFromSeconds" class="visually-hidden">Секунды от</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationFromSeconds" class="filter-input positive-int"
                                           placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">сек.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <span class="range-separator">—</span>
                    <div class="duration-block">
                        <span class="range-prefix">Длительность (До):</span>
                        <div class="duration-picker">
                            <div class="duration-field">
                                <label for="durationToHours" class="visually-hidden">Часы до</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationToHours" class="filter-input positive-int"
                                           placeholder="0" data-max="16" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">ч.</span>
                                </div>
                            </div>
                            <div class="duration-field">
                                <label for="durationToMinutes" class="visually-hidden">Минуты до</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationToMinutes" class="filter-input positive-int"
                                           placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">мин.</span>
                                </div>
                            </div>
                            <div class="duration-field">
                                <label for="durationToSeconds" class="visually-hidden">Секунды до</label>
                                <div class="duration-input-wrapper">
                                    <input type="text" id="durationToSeconds" class="filter-input positive-int"
                                           placeholder="0" data-max="59" maxlength="2" inputmode="numeric"
                                           autocomplete="off">
                                    <span class="unit">сек.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="minDuration" name="durationFrom"
                       th:value="${param.durationFrom != null ? param.durationFrom[0] : ''}">
                <input type="hidden" id="maxDuration" name="durationTo"
                       th:value="${param.durationTo != null ? param.durationTo[0] : ''}">
            </div>

            <div class="filters-modal-footer">
                <button type="button" class="btn btn-primary" id="filtersApplyBtn">Применить фильтры</button>
                <button type="button" class="btn btn-secondary" id="filtersResetBtn">Сброс</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
