<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>
<div th:fragment="sidebar" class="profile-card">
    <style>
        .nav-link svg {
            width: 20px !important;
            height: 20px !important;
            stroke: currentColor !important;
            flex-shrink: 0;
        }
        .sidebar-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: .2s;
        }
        .sidebar-toggle:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }
        .sidebar-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }
        .profile-grid.sidebar-collapsed .sidebar-toggle {
            right: 4px;
            top: 4px;
        }
        .sidebar-toggle .icon-menu {
            display: none;
        }
        .sidebar-toggle .icon-arrow {
            display: block;
        }
        .profile-grid.sidebar-collapsed .sidebar-toggle .icon-menu {
            display: block;
        }
        .profile-grid.sidebar-collapsed .sidebar-toggle .icon-arrow {
            display: none;
        }
        .nav-link svg[stroke="currentColor"] {
            fill: none !important;
        }
        .nav-link.active svg {
            color: #a78bfa;
        }
    </style>

    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Свернуть/развернуть">
        <span class="icon-menu">
            <th:block th:replace="~{fragments/icons :: icon-menu}"></th:block>
        </span>
        <span class="icon-arrow">
            <th:block th:replace="~{fragments/icons :: icon-arrow-left}"></th:block>
        </span>
    </button>

    <div class="sidebar-content">
        <div class="sidebar-profile">
            <div class="sidebar-avatar"
                 id="sidebarAvatar"
                 th:text="${session.sessionUser != null ? #strings.toUpperCase(#strings.substring(session.sessionUser.username, 0, 1)) : '?'}">
            </div>

            <div class="sidebar-profile-name"
                 id="sidebarName"
                 th:text="${(response != null and response.userForOwner != null) ? (response.userForOwner.name != null ? response.userForOwner.name + (response.userForOwner.surname != null ? ' ' + #strings.substring(response.userForOwner.surname, 0, 1) + '.' : '') : response.userForOwner.username) : (groupedResponse != null and groupedResponse.userForOwner != null) ? (groupedResponse.userForOwner.name != null ? groupedResponse.userForOwner.name + (groupedResponse.userForOwner.surname != null ? ' ' + #strings.substring(groupedResponse.userForOwner.surname, 0, 1) + '.' : '') : groupedResponse.userForOwner.username) : session.sessionUser != null ? session.sessionUser.username : 'Гость'}">
            </div>

            <div class="sidebar-profile-phone"
                 id="sidebarPhone"
                 th:text="${(response != null and response.userForOwner != null and response.userForOwner.phone != null) ? response.userForOwner.phone : (groupedResponse != null and groupedResponse.userForOwner != null and groupedResponse.userForOwner.phone != null) ? groupedResponse.userForOwner.phone : ''}">
            </div>

            <div class="sidebar-profile-email"
                 id="sidebarEmail"
                 th:text="${(response != null and response.userForOwner != null and response.userForOwner.email != null) ? response.userForOwner.email : (groupedResponse != null and groupedResponse.userForOwner != null and groupedResponse.userForOwner.email != null) ? groupedResponse.userForOwner.email : ''}">
            </div>
        </div>

        <nav class="nav-menu">
            <a th:href="@{/personal-account}"
               class="nav-link"
               th:classappend="${currentPage == 'personal-account'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-user}"></th:block>
                <span>Личный кабинет</span>
            </a>

            <div class="nav-divider"></div>

            <a th:href="@{/profile/edit}"
               class="nav-link"
               th:classappend="${currentPage == 'profile'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                <span>Мой профиль</span>
            </a>

            <a th:href="@{/movies}"
               class="nav-link"
               th:classappend="${currentPage == 'catalog'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-home}"></th:block>
                <span>Главная</span>
            </a>

            <a th:href="@{/wallet/top-up}"
               class="nav-link"
               th:classappend="${currentPage == 'wallet'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-wallet}"></th:block>
                <span>Пополнить баланс</span>
            </a>

            <div class="nav-divider"></div>

            <a th:href="@{/library}"
               class="nav-link"
               th:classappend="${currentPage == 'library'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-film}"></th:block>
                <span>Моя коллекция</span>
            </a>

            <a th:href="@{/rated/history}"
               class="nav-link"
               th:classappend="${currentPage == 'rated'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                <span>Мои оценки</span>
            </a>

            <a th:href="@{/watched}"
               class="nav-link"
               th:classappend="${currentPage == 'watched'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-watch-history}"></th:block>
                <span>История просмотров</span>
            </a>

            <a th:href="@{/history}"
               class="nav-link"
               th:classappend="${currentPage == 'history'} ? 'active' : ''">
                <th:block th:replace="~{fragments/icons :: icon-clock}"></th:block>
                <span>История покупок</span>
            </a>

            <div class="nav-divider"></div>

            <a th:each="genre : ${genres}"
               th:href="@{/movies(genre=${genre})}"
               class="nav-link">
                <span th:text="${genre}">Боевик</span>
            </a>

            <div class="nav-divider"></div>

            <button class="delete-account-btn"
                    type="button"
                    onclick="openDeleteAccountModal()">
                <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                <span>Удалить аккаунт</span>
            </button>
        </nav>
    </div>
</div>
</body>
</html>
