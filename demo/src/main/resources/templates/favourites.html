<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Избранное — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_favourites.css}">
</head>
<body class="layout-fixed">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>
<div id="authStatus" th:data-authenticated="${sessionUser != null}" style="display:none;"></div>

<main class="catalog-wrapper"
      th:classappend="${catalog == null or #lists.size(catalog) <= 4} ? 'no-scroll' : ''">

    <div class="page-header-row">

        <a th:href="@{/back(fallback='/')}" class="back-btn-header">
            <th:block th:replace="~{fragments/icons :: icon-arrow-left}"></th:block>
            <span>Назад</span>
        </a>

        <div class="profile-right-header">
            <h1>
                <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>
                Избранное
            </h1>
            <div class="greeting-sub" th:if="${catalog != null and !catalog.isEmpty()}">
                Фильмов в избранном:
                <strong th:text="${catalogCount}">0</strong>
            </div>
        </div>

        <div class="page-header-actions">
            <button type="button"
                    class="clear-favourites-btn"
                    data-action="clear-favourites"
                    th:if="${catalog != null and !catalog.isEmpty()}">
                <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                Очистить избранное
            </button>
        </div>

        <th:block th:replace="~{fragments/catalog-search :: catalogSearch}"></th:block>
    </div>

    <div class="catalog-content">
        <div class="favourites-container" th:if="${catalog != null and !catalog.isEmpty()}">
            <div class="media-card favourites-card"
                 th:each="movie : ${catalog}"
                 th:data-movie-id="${movie.id}"
                 th:data-movie-price="${movie.price}"
                 th:data-movie-title="${movie.title}">
                <div class="media-card-poster-link">
                    <a th:href="@{/movies/{id}(id=${movie.id})}">
                        <img th:if="${movie.posterUrl != null and !movie.posterUrl.isEmpty()}"
                             th:src="${movie.posterUrl}"
                             alt="Постер"
                             class="media-card-poster-img"
                             data-poster-img
                             src=""/>
                        <div class="movie-poster-placeholder"
                             th:classappend="${movie.posterUrl != null and !movie.posterUrl.isEmpty()} ? 'hidden' : ''"
                             data-poster-placeholder>
                            <span>Постер</span>
                        </div>
                        <th:block th:replace="~{fragments/rating-badge :: ratingBadge(
                            movieId=${movie.id},
                            rating=${movie.rating}
                        )}"></th:block>
                    </a>
                </div>
                <div class="media-card-content">
                    <h3 class="media-card-title">
                        <a th:href="@{/movies/{id}(id=${movie.id})}"
                           th:text="${movie.title}">Название</a>
                    </h3>
                    <div class="media-card-info">

                        <div class="media-card-info-rows">
                            <div class="media-card-info-row media-card-info-row--year"
                                 th:if="${movie.releaseDate != null}">
                                <th:block th:replace="~{fragments/icons :: icon-calendar}"></th:block>
                                <span class="media-card-info-label">Год выпуска:</span>
                                <span class="media-card-info-value"
                                      th:text="${movie.releaseDate.year}">2018</span>
                            </div>

                            <div class="media-card-info-row media-card-info-row--genre"
                                 th:if="${movie.genre != null and !movie.genre.isEmpty()}">
                                <th:block th:replace="~{fragments/icons :: icon-tag}"></th:block>
                                <span class="media-card-info-label">Жанр:</span>
                                <span class="media-card-info-value"
                                      th:text="${movie.genre}">Фантастика</span>
                            </div>

                            <div class="media-card-info-row media-card-info-row--duration"
                                 th:if="${movie.formattedDuration != null}">
                                <th:block th:replace="~{fragments/icons :: icon-clock}"></th:block>
                                <span class="media-card-info-label">Длительность:</span>
                                <span class="media-card-info-value"
                                      th:text="${movie.formattedDuration}">1:40:00</span>
                            </div>
                        </div>

                        <div class="media-card-price-and-actions">
                            <span class="media-card-price" th:text="${movie.price} + ' ₽'">600 ₽</span>
                            <div class="media-card-actions">
                                <button type="button"
                                        class="icon-btn rating-btn"
                                        data-action="show-rating"
                                        th:data-movie-id="${movie.id}"
                                        th:data-movie-title="${movie.title}"
                                        title="Оценить фильм">
                                    <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                                </button>
                                <button type="button"
                                        class="remove-favourites-btn"
                                        data-action="remove-from-favourites"
                                        th:data-movie-id="${movie.id}"
                                        th:data-movie-title="${movie.title}"
                                        title="Удалить из избранного">
                                    <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${catalog == null or catalog.isEmpty()}" class="empty-message empty-message--danger">
            <div class="empty-icon">
                <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>
            </div>
            <h2>В избранном пока ничего нет</h2>
            <p>Сохраняйте фильмы, которые вам понравились, чтобы быстро возвращаться к ним позже.</p>
            <a th:href="@{/}" class="browse-movies-btn">Перейти в главное меню</a>
        </div>

        <th:block th:if="${catalog == null or catalog.isEmpty()}">
            <th:block th:with="visible=9">
                <th:block th:insert="~{fragments/recommendations :: recommendations}"></th:block>
            </th:block>
        </th:block>
    </div>

</main>

<th:block th:replace="~{fragments/modals/favourites-modals :: favouritesModals}"></th:block>
<th:block th:replace="~{fragments/modals/ratings-modals :: ratingsModals}"></th:block>

<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
