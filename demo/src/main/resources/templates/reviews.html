<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${'Отзывы — ' + response.movieTitle}">Отзывы — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_reviews.css}">
</head>
<body>
<div id="currentUserData"
     th:data-username="${currentUsername != null ? currentUsername : ''}"></div>

<header th:replace="~{fragments/header :: header}"></header>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus"
     th:data-authenticated="${sessionUser != null}"
     style="display:none;"></div>

<main class="reviews-main">
    <div class="reviews-container" th:data-movie-id="${response.movieId}">

        <div class="reviews-header">

            <a th:href="@{/back(fallback='/')}"
               class="back-btn-reviews">
                <th:block th:replace="~{fragments/icons :: icon-arrow-left}"></th:block>
                <span>Назад</span>
            </a>

            <h1>
                <a th:href="@{/movies/{id}(id=${response.movieId})}"
                   th:text="${'🎬 Отзывы к «' + response.movieTitle + '»'}">Отзывы к фильму</a>
            </h1>

            <div class="reviews-header-right">
                <div class="sort-toggle-group" id="sortToggleGroup">
                    <button type="button"
                            class="sort-option"
                            data-order="desc"
                            data-action="sort-toggle">
                        Сначала новые
                    </button>
                    <button type="button"
                            class="sort-option"
                            data-order="asc"
                            data-action="sort-toggle">
                        Сначала старые
                    </button>
                </div>

                <div class="movie-rating-summary">
                    <span class="rating-val"
                          th:attr="data-movie-id=${response.movieId}"
                          th:text="${response.avgRating != null ? '★ ' + #numbers.formatDecimal(response.avgRating, 1, 1) : '★ —'}">
                        ★ 0.0
                    </span>
                    <span class="count"
                          id="reviewsCount"
                          th:text="${response.totalReviews} + ' отзывов'">
                        0 отзывов
                    </span>
                </div>

                <button class="add-review-btn"
                        id="topAddReviewBtn"
                        type="button"
                        th:attr="data-movie-id=${response.movieId}, data-movie-title=${response.movieTitle}"
                        th:style="${(sessionUser != null and response.ownReview == null) ? '' : 'display:none;'}">
                    <th:block th:replace="~{fragments/icons :: icon-plus}"></th:block>
                    Написать отзыв
                </button>
            </div>
        </div>

        <div class="reviews-body"
             id="reviewsBody"
             th:attr="data-movie-id=${response.movieId}">

            <div class="reviews-list" id="reviewsList">

                <div th:if="${response.ownReview != null}"
                     class="review-card own-card"
                     data-own="true"
                     th:data-movie-id="${response.movieId}">
                    <div class="review-header">
                        <div class="review-user">
                            <div class="avatar"
                                 th:with="isDeleted=${response.ownReview.username != null and #strings.contains(response.ownReview.username, 'далённый')}">
                                <span th:if="${isDeleted}" class="avatar-svg">
                                    <th:block th:replace="~{fragments/icons :: icon-user-delete}"></th:block>
                                </span>
                                <span th:unless="${isDeleted}"
                                      th:text="${#strings.substring(response.ownReview.username.toUpperCase(), 0, 1)}">U</span>
                            </div>
                            <span class="review-username" th:text="${response.ownReview.username}">Пользователь</span>
                            <span class="own-badge">Ваш отзыв</span>
                        </div>
                        <div class="review-meta">
                            <span class="review-rating">
                                <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                                <span class="review-rating-value"
                                      th:text="${#numbers.formatDecimal(response.ownReview.ratingValue, 1, 1)}">10.0</span>
                            </span>
                            <span class="review-date"
                                  th:if="${response.ownReview.addedAt != null}"
                                  th:text="${#temporals.format(response.ownReview.addedAt, 'dd.MM.yyyy, HH:mm')}">—</span>
                        </div>
                    </div>
                    <p class="review-text"
                       th:if="${response.ownReview.reviewText != null and !#strings.isEmpty(response.ownReview.reviewText)}"
                       th:text="${response.ownReview.reviewText}">Текст отзыва...</p>
                    <div class="review-actions">
                        <button class="btn-edit" type="button"
                                th:attr="data-movie-id=${response.movieId},
                                         data-movie-title=${response.movieTitle},
                                         data-review-rating=${#numbers.formatDecimal(response.ownReview.ratingValue, 1, 1)},
                                         data-review-text=${response.ownReview.reviewText}">
                            <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                            Редактировать
                        </button>
                        <button class="btn-delete" type="button"
                                th:attr="data-movie-id=${response.movieId}">
                            <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                            Удалить
                        </button>
                    </div>
                </div>

                <div th:each="review : ${response.reviews}"
                     class="review-card"
                     th:data-movie-id="${response.movieId}"
                     th:attr="data-date=${review.addedAt}">
                    <div class="review-header">
                        <div class="review-user">
                            <div class="avatar"
                                 th:with="isDeleted=${review.username != null and #strings.contains(review.username, 'далённый')}">
                                <span th:if="${isDeleted}" class="avatar-svg">
                                    <th:block th:replace="~{fragments/icons :: icon-user-delete}"></th:block>
                                </span>
                                <span th:unless="${isDeleted}"
                                      th:text="${review.username != null ? #strings.substring(review.username.toUpperCase(), 0, 1) : '?'}">U</span>
                            </div>
                            <span class="review-username" th:text="${review.username}">Пользователь</span>
                        </div>
                        <div class="review-meta">
                            <span class="review-rating">
                                <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                                <span class="review-rating-value"
                                      th:text="${#numbers.formatDecimal(review.ratingValue, 1, 1)}">10.0</span>
                            </span>
                            <span class="review-date"
                                  th:if="${review.addedAt != null}"
                                  th:text="${#temporals.format(review.addedAt, 'dd.MM.yyyy, HH:mm')}">—</span>
                        </div>
                    </div>
                    <p class="review-text"
                       th:if="${review.reviewText != null and !#strings.isEmpty(review.reviewText)}"
                       th:text="${review.reviewText}">Текст отзыва...</p>
                </div>
            </div>

            <div id="noReviewsBlock"
                 class="empty-reviews"
                 th:style="${(response.totalReviews == 0 and response.ownReview == null) ? '' : 'display:none;'}">
                <div class="empty-reviews-icon">
                    <th:block th:replace="~{fragments/icons :: icon-comments}"></th:block>
                </div>
                <h2>Пока никто не оставил отзыв</h2>
                <p>Здесь появятся оценки, впечатления и мнения зрителей об этом фильме.</p>
                <div class="empty-reviews-hint">
                    <span>✦</span>
                    <span>Раздел станет активнее с первым отзывом</span>
                </div>
            </div>

        </div>
    </div>
</main>

<th:block th:replace="~{fragments/modals/ratings-modals :: ratingsModals}"></th:block>

<template id="reviewCardTemplate">
    <div class="review-card">
        <div class="review-header">
            <div class="review-user">
                <div class="avatar"></div>
                <span class="review-username"></span>
            </div>
            <div class="review-meta">
                <span class="review-rating">
                    <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                    <span class="review-rating-value"></span>
                </span>
                <span class="review-date"></span>
            </div>
        </div>
        <p class="review-text"></p>
    </div>
</template>

<template id="ownReviewCardTemplate">
    <div class="review-card own-card" data-own="true">
        <div class="review-header">
            <div class="review-user">
                <div class="avatar"></div>
                <span class="review-username"></span>
                <span class="own-badge">Ваш отзыв</span>
            </div>
            <div class="review-meta">
                <span class="review-rating">
                    <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                    <span class="review-rating-value"></span>
                </span>
                <span class="review-date"></span>
            </div>
        </div>
        <p class="review-text"></p>
        <div class="review-actions">
            <button class="btn-edit" type="button">
                <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                Редактировать
            </button>
            <button class="btn-delete" type="button">
                <th:block th:replace="~{fragments/icons :: icon-trash}"></th:block>
                Удалить
            </button>
        </div>
    </div>
</template>

<script th:src="@{/js/modules/sort-toggle.js}" defer></script>
<script th:src="@{/js/modules/date-formatter.js}" defer></script>
<script th:src="@{/js/pages/page-reviews.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
