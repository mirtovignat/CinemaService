<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${card.movie.title + ' — CinemaService'}">Подробнее о фильме — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_show.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus"
     th:data-authenticated="${sessionUser.authenticated}"
     style="display:none;"></div>

<main>
    <div class="movie-details-container"
         th:data-movie-id="${card.movie.id}"
         th:data-movie-title="${card.movie.title}"
         th:data-movie-price="${card.movie.price}">

        <a th:href="@{/back(fallback='/')}" class="back-btn-floating">
            <th:block th:replace="~{fragments/icons :: icon-arrow-left}"></th:block>
            <span>Назад</span>
        </a>

        <h1 class="movie-title"
            th:text="${card.movie.title}">
            Название фильма
        </h1>

        <div class="poster-sidebar">
            <div class="poster-wrapper">

                <img th:if="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()}"
                     th:src="${card.movie.posterUrl}"
                     class="movie-poster-img"
                     alt="Постер"
                     data-poster-img
                     src=""/>

                <div class="movie-poster-placeholder"
                     data-poster-placeholder
                     th:classappend="${card.movie.posterUrl != null and !card.movie.posterUrl.isEmpty()} ? 'hidden' : ''">
                    <div class="poster-placeholder-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.35-4.35a1.5 1.5 0 0 0-2.12 0L7 18"/></svg>
                    </div>
                    <div class="poster-placeholder-text">Нет постера</div>
                    <div class="poster-placeholder-sub">Изображение недоступно</div>
                </div>

                <div class="poster-overlay"
                     th:if="${sessionUser.authenticated
                              and card.status.bought
                              and card.movie.posterUrl != null
                              and !card.movie.posterUrl.isEmpty()}">
                    <button class="watch-btn-neon"
                            type="button"
                            data-action="watch-movie"
                            th:data-movie-id="${card.movie.id}"
                            th:data-movie-title="${card.movie.title}"
                            th:data-poster-url="${card.movie.posterUrl}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        Смотреть
                    </button>
                </div>
            </div>
        </div>

        <div class="movie-info-block">

            <div class="movie-meta-actions">

                <button type="button"
                        class="icon-btn favourite-btn"
                        th:classappend="${card.status.inFavourites} ? 'active' : ''"
                        data-action="toggle-favourite"
                        th:data-movie-id="${card.movie.id}"
                        th:data-movie-title="${card.movie.title}"
                        th:data-state="${card.status.inFavourites} ? 'remove' : 'add'"
                        title="В избранное">
                    <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>
                </button>

                <button type="button"
                        class="icon-btn rating-btn"
                        data-action="show-rating"
                        th:data-movie-id="${card.movie.id}"
                        th:data-movie-title="${card.movie.title}"
                        title="Оценить фильм">
                    <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                </button>

                <a th:href="@{/rated/{id}/reviews(id=${card.movie.id})}"
                   class="icon-btn comment-btn"
                   title="Отзывы и комментарии">
                    <th:block th:replace="~{fragments/icons :: icon-comments}"></th:block>
                    <span class="reviews-count-text"
                          th:data-movie-id="${card.movie.id}"
                          th:text="'Отзывы: ' + ${card.movie.ratingsCount != null ? card.movie.ratingsCount : 0} + ' шт.'">
                        Отзывы: 0 шт.
                    </span>
                </a>

            </div>

            <div class="info-grid">

                <div class="info-item">
                    <div class="info-label">Дата выпуска</div>
                    <div class="info-value"
                         th:text="${card.movie.releaseDate != null ? #temporals.format(card.movie.releaseDate, 'dd.MM.yyyy') : '-'}">
                        -
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">Жанр</div>
                    <div class="info-value"
                         th:text="${card.movie.genre != null ? card.movie.genre : '-'}">
                        -
                    </div>
                </div>

                <div class="info-item" th:if="${card.movie.ageRating != null}">
                    <div class="info-label">Возрастной рейтинг</div>
                    <div class="info-value" th:text="${card.movie.ageRating} + '+'">18+</div>
                </div>

                <div class="info-item"
                     th:if="${card.movie.director != null}">
                    <div class="info-label">Режиссёр</div>
                    <div class="info-value"
                         th:text="${card.movie.director}">
                        -
                    </div>
                </div>

                <div class="info-item"
                     th:if="${card.movie.formattedDuration != null}">
                    <div class="info-label">Длительность</div>
                    <div class="info-value"
                         th:text="${card.movie.formattedDuration}">
                        -
                    </div>
                </div>

            </div>

            <div class="movie-cast-block"
                 th:if="${card.movie.actors != null and !#lists.isEmpty(card.movie.actors)}">
                <div class="cast-label">
                    <th:block th:replace="~{fragments/icons :: icon-user}"></th:block>
                    В главных ролях
                </div>
                <div class="cast-list">
                    <span class="cast-chip"
                          th:each="actor : ${card.movie.actors}"
                          th:text="${actor}">
                        Имя актёра
                    </span>
                </div>
            </div>

            <div class="price-description-row">

                <div class="movie-description"
                     th:if="${card.movie.description != null and !card.movie.description.isEmpty()}">

                    <div class="desc-label">Описание</div>

                    <p class="desc-text"
                       th:text="${card.movie.description}">
                    </p>

                </div>

            </div>

            <div class="details-actions">

                <div class="price-and-buttons">

                    <div class="rating-block-bottom"
                         th:if="${card.movie.rating != null}">
                        <span class="rating-label-bottom">Средний рейтинг:</span>
                        <span class="rating-value-bottom js-rating-badge-max"
                              th:data-movie-id="${card.movie.id}"
                              th:text="'★ ' + ${#numbers.formatDecimal(card.movie.rating, 1, 1)} + ' / 10'">★ 7,7 / 10</span>
                    </div>

                    <div class="price-block">

                        <div class="price-block-icon"
                             aria-hidden="true">
                            <th:block th:replace="~{fragments/icons :: icon-money}"></th:block>
                        </div>

                        <div class="price-content">
                            <span class="price-label">Цена</span>
                            <span class="price-amount"
                                  th:text="${card.movie.price} + ' ₽'">
                                0 ₽
                            </span>
                        </div>

                    </div>

                    <div class="action-buttons">

                        <th:block th:if="${sessionUser.authenticated}">

                            <button type="button"
                                    th:if="${!card.status.bought and !card.status.inCart}"
                                    class="cart-button to-cart-btn-details"
                                    data-action="add-to-cart"
                                    th:data-movie-id="${card.movie.id}"
                                    th:data-movie-title="${card.movie.title}"
                                    th:data-movie-price="${card.movie.price}">
                                В корзину
                            </button>

                            <a th:if="${card.status.inCart}"
                               th:href="@{/cart(highlight=${card.movie.id})}"
                               class="cart-button in-cart-btn-details">
                                В корзине →
                            </a>

                            <button type="button"
                                    th:if="${!card.status.bought}"
                                    class="buy-now-btn"
                                    data-action="buy-now"
                                    th:data-movie-id="${card.movie.id}"
                                    th:data-movie-title="${card.movie.title}"
                                    th:data-movie-price="${card.movie.price}">
                                Купить сейчас
                            </button>

                            <a th:if="${card.status.bought}"
                               th:href="@{/library(highlight=${card.movie.id})}"
                               class="bought-btn">
                                Куплено → В коллекцию
                            </a>

                        </th:block>

                        <th:block th:unless="${sessionUser.authenticated}">

                            <button type="button"
                                    class="cart-button to-cart-btn-details"
                                    data-action="add-to-cart"
                                    th:data-movie-id="${card.movie.id}"
                                    th:data-movie-title="${card.movie.title}"
                                    th:data-movie-price="${card.movie.price}">
                                В корзину
                            </button>

                            <button type="button"
                                    class="buy-now-btn"
                                    data-action="buy-now"
                                    th:data-movie-id="${card.movie.id}"
                                    th:data-movie-title="${card.movie.title}"
                                    th:data-movie-price="${card.movie.price}">
                                Купить сейчас
                            </button>

                        </th:block>

                    </div>

                </div>

            </div>

        </div>
    </div>
</main>

<th:block th:replace="~{fragments/modals/cart-modals :: cartModals}"></th:block>
<th:block th:replace="~{fragments/modals/favourites-modals :: favouritesModals}"></th:block>
<th:block th:replace="~{fragments/modals/ratings-modals :: ratingsModals}"></th:block>

<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
