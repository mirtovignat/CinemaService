<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Личный кабинет — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_personal-account.css}">
</head>

<body class="layout-fixed">

<div class="header-wrapper">
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</div>

<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus"
     th:data-authenticated="${sessionUser != null}"
     style="display:none;"></div>

<div id="userIdHolder"
     th:data-user-id="${response.userForOwner.id}"
     style="display:none;"></div>

<main class="profile-wrapper">
    <div th:if="${response}"
         class="profile-grid"
         id="profileGrid">

        <th:block
                th:replace="~{fragments/sidebar :: sidebar(currentPage='personal-account', genres=${response.genres}, userForOwner=${response.userForOwner})}">
        </th:block>

        <div class="profile-right">

            <div class="profile-right-header">
                <div>
                    <h1 id="mainTitle"
                        class="greeting"
                        th:with="u=${response.userForOwner},
                                 fullName=${u.name != null and !#strings.isEmpty(u.name)
                                             ? (u.patronymic != null and !#strings.isEmpty(u.patronymic)
                                                 ? u.name + ' ' + u.patronymic
                                                 : u.name)
                                             : u.username}">
                        <span class="greeting-line-1">CinemaService рад приветствовать Вас,</span>
                        <span class="greeting-line-2" th:text="${fullName + '!'}">Игнат Антонович!</span>
                    </h1>
                </div>
            </div>

            <div id="mainContent">

                <section class="favorites-section">

                    <div class="section-label" style="justify-content: flex-start;">
                        <span style="font-size:1.1rem;color:#f1f5f9;display:inline-flex;align-items:baseline;gap:0.35rem;">
                            <th:block th:replace="~{fragments/icons :: icon-heart}"></th:block>
                            <span style="font-weight:600;">Мои любимые фильмы:</span>
                            <span style="font-weight:400;color:#64748b;"
                                  th:utext="'ТОП-' + ${#lists.size(response.topThreeRatedMovies)}">
                            </span>
                        </span>
                    </div>

                    <div class="favorites-grid"
                         th:if="${#lists.isEmpty(response.topThreeRatedMovies)}">

                        <div class="favorites-empty-card">
                            <th:block th:replace="~{fragments/icons :: icon-film}"></th:block>

                            <div class="empty-title">
                                Вы пока не оценили ни одного фильма
                            </div>

                            <div class="empty-link">
                                <a th:href="@{/movies}">
                                    Перейти в каталог
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="favorites-grid"
                         th:unless="${#lists.isEmpty(response.topThreeRatedMovies)}">

                        <div class="fav-card"
                             th:each="ratedMovie, iterStat : ${response.topThreeRatedMovies}">

                            <div class="fav-poster"
                                 style="background:#0d1322;">

                                <a th:href="@{/movies/{id}(id=${ratedMovie.id})}"
                                   style="display:block;width:100%;height:100%;position:relative;text-decoration:none;">

                                    <img th:if="${ratedMovie.posterUrl != null and !ratedMovie.posterUrl.isEmpty()}"
                                         th:src="${ratedMovie.posterUrl}"
                                         th:alt="${ratedMovie.title}"
                                         src=""
                                         alt="">

                                    <div th:unless="${ratedMovie.posterUrl != null and !ratedMovie.posterUrl.isEmpty()}"
                                         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:.75rem;background:#1a1f2b;">
                                        Нет постера
                                    </div>

                                    <span class="fav-rank">
                                        #<span th:text="${iterStat.index + 1}">1</span>
                                    </span>
                                </a>
                            </div>

                            <div class="fav-info">

                                <div class="fav-title"
                                     th:text="${ratedMovie.title} ?: 'Без названия'">
                                </div>

                                <div class="fav-meta">
                                    <span th:text="${ratedMovie.releaseDate != null ? ratedMovie.releaseDate.year : ''}">
                                        Год
                                    </span>

                                    <span class="fav-score">
                                        <th:block th:replace="~{fragments/icons :: icon-star}"></th:block>
                                        <span th:text="${ratedMovie.ratingValue}">
                                            0
                                        </span>
                                        /10
                                    </span>
                                </div>

                                <div style="font-size:.6rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem;"
                                     th:text="${ratedMovie.review} ?: 'Без отзыва'">
                                </div>

                            </div>
                        </div>
                    </div>
                </section>

                <section class="recommendations-section"
                         id="recommendationsSection"
                         th:if="${!response.recommendedMovies.isEmpty()}">

                    <div class="section-label">

                        <span>
                            Вам могло бы понравиться (ПРОЛИСТЫВАЙТЕ ВПРАВО)
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                 stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"/>
                            </svg>
                        </span>

                    </div>

                    <div class="rec-scroll-wrapper"
                         id="recScrollWrapper">

                        <div class="rec-grid"
                             id="recGrid">

                            <div class="rec-card"
                                 th:each="movie : ${response.recommendedMovies}"
                                 th:data-movie-id="${movie.id}">

                                <a th:href="@{/movies/{id}(id=${movie.id})}"
                                   style="display:block;text-decoration:none;color:inherit;">

                                    <div class="rec-poster"
                                         style="background:#0d1322;">

                                        <img th:if="${movie.posterUrl != null and !movie.posterUrl.isEmpty()}"
                                             th:src="${movie.posterUrl}"
                                             th:alt="${movie.title}"
                                             src=""
                                             alt="">

                                        <div th:unless="${movie.posterUrl != null and !movie.posterUrl.isEmpty()}"
                                             style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:.6rem;background:#1a1f2b;">
                                            Нет постера
                                        </div>

                                    </div>

                                    <div class="rec-info">
                                        <div class="rec-title"
                                             th:text="${movie.title}">
                                        </div>

                                        <div class="rec-year"
                                             th:text="${movie.releaseDate != null ? movie.releaseDate.year : ''}">
                                        </div>
                                    </div>

                                </a>
                            </div>

                        </div>
                    </div>

                </section>
            </div>
        </div>
    </div>
</main>

<template id="recCardTemplate">
    <div class="rec-card">
        <a class="rec-card-link">
            <div class="rec-poster">
                <img class="rec-poster-img" alt="">
                <div class="rec-poster-empty" style="display:none;">Нет постера</div>
            </div>
            <div class="rec-info">
                <div class="rec-title"></div>
                <div class="rec-year"></div>
            </div>
        </a>
    </div>
</template>

<script th:src="@{/js/pages/page-personal-account.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
