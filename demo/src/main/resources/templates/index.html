<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${response.isSearch()} ? 'Результаты поиска — CinemaService' : 'Каталог — CinemaService'">Каталог — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        main.catalog-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 0.1rem 0.5rem 0.2rem;
            box-sizing: border-box;
        }
        .poster-rating-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: rgba(217, 119, 6, 0.85);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .catalog-header {
            text-align: center;
            padding: 0.1rem 0 0.2rem;
            width: 100%;
        }
        .catalog-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e7ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(5, 250px);
            gap: 2rem 1rem;
            width: 100%;
            max-width: 1340px;
            justify-content: center;
            align-items: stretch;
            grid-auto-rows: 1fr;
        }
        @media (max-width: 1350px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fit, 250px);
            }
        }
        .movie-card {
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 18px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            backdrop-filter: blur(8px);
            overflow: hidden;
            width: 250px;
            box-sizing: border-box;
            margin: 0 auto;
            position: relative;
            height: 100%;
            align-self: stretch;
        }
        .movie-card-content .badges {
            flex-grow: 1;
        }
        .movie-poster-link {
            width: 100%;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-color: #0d1322;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .movie-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            max-width: 100%;
        }
        .movie-card-content {
            padding: 0.4rem 0.6rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }
        .movie-poster-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            font-size: 0.95rem;
        }
        .movie-card-title {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            word-break: break-word;
            line-height: 1.3;
        }
        .movie-card-title a {
            color: #fff;
            text-decoration: none;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .badge {
            font-size: 0.65rem;
            padding: 1px 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .badge svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #c084fc;
            margin: 0;
            margin-top: auto;
            margin-bottom: 0.2rem;
            min-height: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .price svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #c084fc;
        }
        .movie-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 32px;
            margin-top: 0.2rem;
            margin-bottom: 0.2rem;
        }
        .icon-btn {
            width: 39px;
            height: 39px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(72, 187, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: inherit;
            position: relative;
            text-decoration: none;
            flex-shrink: 0;
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
        }
        .rating-btn svg {
            color: #fcd34d;
            stroke: #fcd34d;
            stroke-width: 2;
        }
        .rating-btn svg * {
            color: #fcd34d;
            stroke: #fcd34d;
        }
        .rating-btn:hover {
            border-color: #fcd34d;
            color: #fcd34d;
        }
        .icon-btn.favourite-btn:not(.active) svg {
            color: #ffffff;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }
        .icon-btn.favourite-btn.active svg {
            color: #ffffff;
            stroke: #ffffff;
            stroke-width: 1.5;
            fill: #ffffff;
        }
        .icon-btn.favourite-btn,
        .icon-btn.favourite-btn.active {
            border-color: rgba(72, 187, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }
        .movie-actions {
            min-height: 44px;
        }
        .purchase-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-top: auto;
            padding-top: 0.2rem;
            min-height: 72px;
            justify-content: flex-end;
        }
        .cart-button,
        .buy-now-btn,
        .bought-btn {
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            width: 100%;
            box-sizing: border-box;
            min-height: 28px;
            height: 32px;
            line-height: 1;
        }
        .to-cart-btn-details {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        .in-cart-btn-details {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .buy-now-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .bought-btn {
            background: #64748b;
            color: white;
            cursor: pointer;
            opacity: 0.8;
            text-decoration: none;
        }
        main.catalog-wrapper > *:last-child,
        [class*="pagination"],
        [class*="pager"] {
            margin-top: 0.2rem !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }
        .comment-btn .reviews-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #3b82f6;
            color: #fff;
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-sizing: border-box;
            line-height: 1;
        }
        .empty-catalog {
            text-align: center;
            padding: 2rem 0;
        }
        .browse-movies-btn {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease;
        }
        .browse-movies-btn:hover {
            transform: scale(1.05);
        }
        .pagination-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>
<div id="authStatus" th:data-authenticated="${session.sessionUser != null}" style="display:none;"></div>
<main class="catalog-wrapper" id="catalogMain">
    <div class="catalog-header">
        <h1 th:if="${response.isSearch()}" style="color: #a78bfa; text-align: center;">Результаты поиска</h1>
        <h1 th:unless="${response.isSearch()}" style="text-align: center;">Лучшие фильмы и сериалы СПЕЦИАЛЬНО ДЛЯ ВАС!</h1>
    </div>
    <div id="catalogContent">
        <th:block th:replace="~{fragments/movie-grid :: grid(response=${response})}"></th:block>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper">
        <th:block th:replace="~{fragments/pagination :: pager(page=${response.cardsPage()}, url='/movies')}"></th:block>
    </div>
</main>
<th:block th:replace="~{fragments/modals :: buyModal}"></th:block>
<th:block th:replace="~{fragments/modals :: ratingModal}"></th:block>
<script th:src="@{/js/main.js}" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.reviews-badge[data-movie-id]').forEach(function(el) {
            var id = el.getAttribute('data-movie-id');
            if (id) {
                updateReviewsCount(id);
            }
        });
    });
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            document.querySelectorAll('.reviews-badge[data-movie-id]').forEach(function(el) {
                var id = el.getAttribute('data-movie-id');
                if (id) {
                    updateReviewsCount(id);
                }
            });
        }
    });
    document.addEventListener('click', function(e) {
        var link = e.target.closest('.page-nav');
        if (!link) {
            return;
        }
        if (link.classList.contains('active')) {
            e.preventDefault();
            return;
        }
        var href = link.getAttribute('href');
        if (!href || href === '#') {
            return;
        }
        e.preventDefault();
        var pagination = document.querySelector('.pagination');
        if (pagination) {
            pagination.classList.add('pagination-loading');
        }
        fetch(href, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.text();
        })
        .then(function(html) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var newContent = doc.querySelector('#catalogContent');
            var newPagination = doc.querySelector('.pagination-wrapper');
            if (newContent) {
                var oldContent = document.querySelector('#catalogContent');
                if (oldContent) {
                    oldContent.innerHTML = newContent.innerHTML;
                }
            }
            if (newPagination) {
                var oldPagination = document.querySelector('.pagination-wrapper');
                if (oldPagination) {
                    oldPagination.innerHTML = newPagination.innerHTML;
                }
            }
            history.pushState({}, '', href);
            document.querySelectorAll('.reviews-badge[data-movie-id]').forEach(function(el) {
                var id = el.getAttribute('data-movie-id');
                if (id) {
                    updateReviewsCount(id);
                }
            });
            document.querySelectorAll('.js-rating-badge[data-movie-id]').forEach(function(el) {
                var id = el.getAttribute('data-movie-id');
                if (id) {
                    updateMovieRating(id);
                }
            });
            if (pagination) {
                pagination.classList.remove('pagination-loading');
            }
        })
        .catch(function(error) {
            console.error('Error loading page:', error);
            if (pagination) {
                pagination.classList.remove('pagination-loading');
            }
            window.location.href = href;
        });
    });
</script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
