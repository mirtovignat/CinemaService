<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Моя коллекция — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_library.css}">
</head>
<body class="layout-fixed">
<div class="header-wrapper">
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</div>

<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus" th:data-authenticated="${sessionUser != null}" style="display:none;"></div>
<main class="profile-wrapper">
    <div class="profile-grid">
        <th:block
                th:replace="~{fragments/sidebar :: sidebar(currentPage='library', userForOwner=${response.userForOwner})}">
        </th:block>

        <div class="profile-right">

            <div class="page-header-row">
                <div class="profile-right-header">
                    <h1>
                        <th:block th:replace="~{fragments/icons :: icon-film}"></th:block>
                        Моя коллекция
                    </h1>
                    <div class="greeting-sub"
                         th:if="${response != null and response.catalog != null}">
                        Всего фильмов:
                        <strong th:text="${#lists.size(response.catalog)}">0</strong>
                    </div>
                </div>
                <th:block th:replace="~{fragments/sort-toggle :: sortToggle}"></th:block>
                <th:block th:replace="~{fragments/catalog-search :: catalogSearch}"></th:block>
            </div>

            <div th:if="${response != null and response.catalog != null and not #lists.isEmpty(response.catalog)}"
                 class="library-container">

                <div th:each="item : ${response.catalog}"
                     class="media-card library-card"
                     th:classappend="${item.watched} ? 'watched' : ''"
                     th:attr="data-movie-id=${item.id},
                              data-added-at=${item.addedAt != null ? #temporals.format(item.addedAt, 'yyyy-MM-dd''T''HH:mm:ss') : ''},
                              data-date=${item.addedAt != null ? #temporals.format(item.addedAt, 'yyyy-MM-dd''T''HH:mm:ss') : ''}">

                    <div class="media-card-poster-link">

                        <a class="poster-link"
                           href="javascript:void(0);"
                           data-action="watch-movie"
                           th:data-movie-id="${item.id}"
                           th:data-movie-title="${item.title}"
                           th:data-poster-url="${item.posterUrl}">

                            <img th:if="${item.posterUrl != null and !item.posterUrl.isEmpty()}"
                                 th:src="${item.posterUrl}"
                                 alt="Постер"
                                 class="media-card-poster-img"
                                 data-poster-img
                                 src=""/>

                            <div class="movie-poster-placeholder"
                                 th:classappend="${item.posterUrl != null and !item.posterUrl.isEmpty()} ? 'hidden' : ''"
                                 data-poster-placeholder>
                                <span>Постер</span>
                            </div>

                            <th:block th:replace="~{fragments/rating-badge :: ratingBadge(
                                movieId=${item.id},
                                rating=${item.rating}
                            )}"></th:block>

                        </a>

                        <div class="poster-overlay">
                            <th:block th:replace="~{fragments/watch-button :: watchButton(
                                movieId=${item.id},
                                movieTitle=${item.title},
                                posterUrl=${item.posterUrl},
                                watched=${item.watched},
                                variant='md'
                            )}"></th:block>
                        </div>
                    </div>

                    <div class="media-card-content">
                        <h3 class="media-card-title">
                            <a th:href="@{/movies/{id}(id=${item.id})}"
                               th:text="${item.title}">
                                Название
                            </a>
                        </h3>

                        <div class="media-card-info">

                            <div class="library-genre-tag"
                                 th:if="${item.genre != null and !item.genre.isEmpty()}">
                                <span class="genre-label">
                                    <th:block th:replace="~{fragments/icons :: icon-tag}"></th:block>
                                    Жанр:
                                </span>
                                <span class="genre-value" th:text="${item.genre}">
                                    Фантастика
                                </span>
                            </div>

                            <div class="library-info-row"
                                 th:if="${item.director != null and !item.director.isEmpty()}">
                                <span class="library-info-icon">
                                    <th:block th:replace="~{fragments/icons :: icon-video}"></th:block>
                                </span>
                                <span class="library-info-label">Режиссёр</span>
                                <span class="library-info-value"
                                      th:text="${item.director}"
                                      th:title="${item.director}">
                                    Кристофер Нолан
                                </span>
                            </div>

                            <div class="library-info-row"
                                 th:if="${item.ageRating != null}">
                                <span class="library-info-icon">
                                    <th:block th:replace="~{fragments/icons :: icon-lock}"></th:block>
                                </span>
                                <span class="library-info-label">Возрастной рейтинг</span>
                                <span class="library-info-value"
                                      th:text="${item.ageRating} + '+'">
                                    18+
                                </span>
                            </div>

                            <div class="library-info-row"
                                 th:if="${item.releaseDate != null}">
                                <span class="library-info-icon">
                                    <th:block th:replace="~{fragments/icons :: icon-calendar}"></th:block>
                                </span>
                                <span class="library-info-label">Год выпуска</span>
                                <span class="library-info-value"
                                      th:text="${item.releaseDate.year}">
                                    2024
                                </span>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${response == null or response.catalog == null or #lists.isEmpty(response.catalog)}"
                 class="empty-state">
                <p>Ваша коллекция пуста</p>
                <a href="/" class="watch-btn-empty">Перейти в главное меню</a>
            </div>

        </div>
    </div>
</main>

<script th:src="@{/js/pages/highlight.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
