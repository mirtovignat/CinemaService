<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Добавить фильм — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_create-movie.css}">
</head>
<body class="index-page">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus" th:data-authenticated="${sessionUser.authenticated}" style="display:none;"></div>

<main class="catalog-wrapper">
    <div class="create-movie-wrapper"
         th:attr="
            data-max-results='100',
            data-msg-empty-input=#{error.CREATE_MOVIE_EMPTY_INPUT},
            data-msg-search-failed=#{error.CREATE_MOVIE_SEARCH_FAILED},
            data-msg-no-selection=#{error.CREATE_MOVIE_NO_SELECTION},
            data-msg-price-required=#{error.CREATE_MOVIE_PRICE_REQUIRED},
            data-msg-fill-all-confirm=#{error.CREATE_MOVIE_FILL_ALL_CONFIRM},
            data-msg-fill-all-empty-price=#{error.CREATE_MOVIE_FILL_ALL_EMPTY_PRICE},
            data-msg-fill-all-nothing=#{error.CREATE_MOVIE_FILL_ALL_NOTHING},
            data-msg-limit-reached=#{error.TOO_MANY_TMDB_RESULTS('{0}','{1}')},
            data-msg-already-exists-intro=#{error.TMDB_MOVIE_ALREADY_EXISTS},
            data-msg-already-exists-intro-plural=#{error.TMDB_MOVIE_ALREADY_EXISTS},
            data-msg-confirm-yes='Да',
            data-msg-confirm-no='Отмена'
         ">

        <div class="create-movie-header-group">
            <h1 class="create-movie-title">Добавить фильм</h1>

            <div class="create-movie-search-form">
                <div class="search-block">
                    <div class="search-block-title">1. По TMDB ID</div>
                    <div class="form-group">
                        <label for="tmdbIdInput">
                            TMDB ID
                            <span class="hint">Через запятую, точку с запятой или с новой строки. Не более 100.</span>
                        </label>
                        <textarea id="tmdbIdInput" rows="2" placeholder="862, 863, 10193"></textarea>
                    </div>
                </div>

                <div class="search-block">
                    <div class="search-block-title">2. По названию</div>
                    <div class="form-group">
                        <label for="titleInput">
                            Названия
                            <span class="hint">Каждое с новой строки. Точное совпадение, ru/en.</span>
                        </label>
                        <textarea id="titleInput" rows="2" placeholder="Матрица&#10;Матрица: Перезагрузка"></textarea>
                    </div>
                </div>

                <div class="search-block">
                    <div class="search-block-title">3. По режиссёру / актёру</div>
                    <div class="mode-panel--grid">
                        <div class="form-group">
                            <label for="directorInput">
                                Режиссёры
                                <span class="hint">Каждый с новой строки.</span>
                            </label>
                            <textarea id="directorInput" rows="2"
                                      placeholder="Лана Вачовски&#10;Лилли Вачовски"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="actorInput">
                                Актёры
                                <span class="hint">Каждый с новой строки.</span>
                            </label>
                            <textarea id="actorInput" rows="2" placeholder="Киану Ривз&#10;Лоренс Фишбёрн"></textarea>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button type="button" class="btn-search" id="searchBtn">Найти</button>
                    <button type="button" class="btn-clear" id="clearBtn">Очистить</button>
                </div>
            </div>
        </div>

        <div class="results-and-summary">
            <div class="results-toolbar">
                <button type="button" class="btn-select-all" id="selectAllBtn" disabled>Выбрать все</button>
                <div class="bulk-price">
                    <label for="bulkPriceInput" class="price-label">Цена для всех (₽):</label>
                    <input type="number" id="bulkPriceInput" class="price-input" step="0.01" min="0.01"
                           placeholder="Например, 299"/>
                    <button type="button" class="btn-fill-all" id="fillAllBtn" disabled>Применить</button>
                </div>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div class="selection-summary">
                <span id="selectionSummary">Выбрано: 0 / 100</span>
            </div>

            <div id="resultsContainer" class="results"></div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">🎬</div>
                <div class="empty-title">Здесь появятся фильмы</div>
                <div class="empty-desc">Введите TMDB ID, название или имя режиссёра/актёра в поля выше, затем нажмите
                    «Найти».
                </div>
            </div>

            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="spinner"></div>
                <div class="loading-text">Идет поиск фильмов...</div>
            </div>
        </div>

        <div class="actions">
            <a th:href="@{/}" class="btn-cancel">Отмена</a>
            <button type="button" class="btn-create" id="createBtn" disabled>Создать выбранные</button>
        </div>
    </div>
</main>

<div id="confirmModal" class="modal-overlay" hidden>
    <div class="modal-window">
        <p id="confirmModalText" class="modal-text"></p>
        <div class="modal-actions">
            <button type="button" class="btn-modal-cancel" id="confirmModalCancel">Отмена</button>
            <button type="button" class="btn-modal-confirm" id="confirmModalOk">Да</button>
        </div>
    </div>
</div>

<script th:src="@{/js/pages/page-create-movie.js}" defer></script>
</body>
</html>
