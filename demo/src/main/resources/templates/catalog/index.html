<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title th:text="${moviesPageResponse != null and moviesPageResponse.isSearch()} ? 'Результаты поиска — CinemaService' : 'Каталог — CinemaService'">Каталог</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_catalog.css}">
</head>
<body class="index-page">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus" th:data-authenticated="${sessionUser.authenticated}" style="display:none;"></div>

<div id="userIdHolder"
     th:if="${sessionUser.authenticated}"
     th:data-user-id="${sessionUser.id()}"
     style="display:none;"></div>

<main class="catalog-wrapper" id="catalogMain">
    <div class="catalog-header">
        <h1 th:if="${moviesPageResponse != null and moviesPageResponse.isSearch()}" class="catalog-header-title catalog-header-title--search">
            <span>Результаты поиска</span>
            <span class="catalog-header-icon">
                <th:block th:replace="~{fragments/icons :: icon-search}"></th:block>
            </span>
        </h1>
        <th:block th:unless="${moviesPageResponse != null and moviesPageResponse.isSearch()}">
            <div class="catalog-header-row">
                <h1 style="text-align:center;">Лучшие фильмы и сериалы СПЕЦИАЛЬНО ДЛЯ ВАС!</h1>
                <a th:href="@{/movies/new}" class="suggest-movie-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Предложить свой
                </a>
            </div>
        </th:block>
    </div>

    <input type="hidden" id="catalogTotalMatches" th:value="${moviesPageResponse != null and moviesPageResponse.cardsPage() != null ? moviesPageResponse.cardsPage().totalElements : 0}">

    <div class="catalog-content">
        <div id="catalogContent">
            <th:block th:replace="~{fragments/movie-grid :: grid(moviesPageResponse=${moviesPageResponse}, genreMoviesPageResponse=${genreMoviesPageResponse})}"></th:block>
        </div>

        <div class="pagination-wrapper" id="paginationWrapper">
            <th:block th:replace="~{fragments/pagination :: pager(page=${moviesPageResponse != null ? moviesPageResponse.cardsPage() : genreMoviesPageResponse.cardsPage()}, url='/movies')}"></th:block>
        </div>

        <th:block th:if="${moviesPageResponse != null and moviesPageResponse.isSearch() and (moviesPageResponse.cardsPage() == null or moviesPageResponse.cardsPage().empty)}">
            <th:block th:with="visible=9">
                <th:block th:insert="~{fragments/recommendations :: recommendations}"></th:block>
            </th:block>
        </th:block>
    </div>
</main>

<th:block th:replace="~{fragments/modals/cart-modals :: cartModals}"></th:block>
<th:block th:replace="~{fragments/modals/favourites-modals :: favouritesModals}"></th:block>
<th:block th:replace="~{fragments/modals/ratings-modals :: ratingsModals}"></th:block>

<script th:src="@{/js/pages/page-catalog.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
