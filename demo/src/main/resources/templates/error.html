<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${error != null ? error + ' — CinemaService' : 'Ошибка — CinemaService'}">Ошибка</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 40px 20px;
        }
        .error-card {
            max-width: 560px;
            width: 100%;
            text-align: center;
            background: #1a1f2b;
            border: 1px solid #2a3142;
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .error-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 32px;
        }
        .error-logo img {
            width: 32px;
            height: 32px;
        }
        .error-code {
            font-size: 84px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
            margin: 0 0 12px;
        }
        .error-text {
            font-size: 15px;
            color: #94a3b8;
            margin: 0 0 32px;
            line-height: 1.5;
        }
        .error-btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 10px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body>

<div class="error-card">
    <a href="/" class="error-logo">
        <img src="/favicon.ico" alt="CinemaService">
        CinemaService
    </a>

    <div class="error-code" th:text="${status != null ? status : 500}">500</div>

    <h1 class="error-title"
        th:text="${error != null ? error : 'Что-то пошло не так'}">
        Что-то пошло не так
    </h1>

    <p class="error-text"
       th:text="${message != null ? message : 'Мы уже работаем над этим. Попробуйте обновить страницу позже.'}">
        Мы уже работаем над этим.
    </p>

    <a href="/" class="error-btn">Вернуться на главную</a>
</div>

</body>
</html>
