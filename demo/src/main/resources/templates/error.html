<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${error != null ? error + ' — CinemaService' : 'Ошибка — CinemaService'}">Ошибка</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/favicon.png}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/pages/_error.css}">
</head>
<body>
<div class="error-card">
    <a href="/" class="error-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
        <img src="/logo.png" alt="" style="height: 40px; width: 40px; object-fit: cover; border-radius: 6px; pointer-events: none;">
        <span style="font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 600; color: white;">
            CinemaService
        </span>
    </a>
    <div class="error-code" th:text="${status != null ? status : 500}">500</div>
    <h1 class="error-title" th:text="${error != null ? error : 'Что-то пошло не так'}">Что-то пошло не так</h1>
    <p class="error-text"
       th:text="${message != null ? message : 'Мы уже работаем над этим. Попробуйте обновить страницу позже.'}">Мы уже
        работаем над этим.</p>
    <a href="/" class="error-btn">Вернуться на главную</a>
</div>
</body>
</html>
