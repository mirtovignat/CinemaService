<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Мой профиль — CinemaService</title>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/_profile.css}">
</head>
<body class="layout-fixed">
<div class="header-wrapper">
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</div>

<th:block th:replace="~{fragments/flash-messages :: flashMessages}"></th:block>

<div id="authStatus" th:data-authenticated="${sessionUser.authenticated}" style="display:none;"></div>
<div id="userIdHolder" th:data-user-id="${response.userForOwner.id}" style="display:none;"></div>

<main class="profile-wrapper">
    <div class="profile-grid" id="profileGrid">

        <th:block
                th:replace="~{fragments/sidebar :: sidebar(currentPage='profile', genres=${response.genres}, userSidebar=${response.userSidebar()})}">
        </th:block>

        <div class="profile-right">
            <div class="profile-content">

                <div class="profile-right-header">
                    <div class="profile-title-block">
                        <h1>
                            <th:block th:replace="~{fragments/icons :: icon-user}"></th:block>
                            Мой профиль
                        </h1>
                        <p class="profile-subtitle">Личная информация и контактные данные</p>
                    </div>
                </div>

                <section class="profile-section">
                    <h2 class="profile-section-title">
                        <span></span>
                        Личные данные
                    </h2>

                    <div class="profile-detail-card personal-card">
                        <div class="personal-grid">

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Фамилия</span>
                                <div class="detail-value">
                                    <span th:text="${response.userForOwner.surname}"></span>
                                </div>
                            </div>

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Имя</span>
                                <div class="detail-value">
                                    <span th:text="${response.userForOwner.name}"></span>
                                </div>
                            </div>

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Отчество</span>
                                <div class="detail-value">
                                    <span th:text="${response.userForOwner.patronymic}"></span>
                                </div>
                            </div>

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Дата рождения</span>
                                <div class="detail-value">
                                    <span th:text="${#temporals.format(response.userForOwner.birthDate, 'dd MMMM yyyy')}"></span>
                                </div>
                            </div>

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Возрастной рейтинг</span>
                                <div class="detail-value">
                                    <span th:text="${response.userForOwner.age} + ' лет'"></span>
                                </div>
                            </div>

                            <div class="detail-group fio-readonly">
                                <span class="detail-label">Пол</span>
                                <div class="detail-value">
                                    <span th:text="${response.userForOwner.sex ? 'Мужской' : 'Женский'}"></span>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>

                <section class="profile-section">
                    <h2 class="profile-section-title">
                        <span></span>
                        Контактные данные
                    </h2>

                    <div class="profile-detail-card">
                        <div class="contact-list">

                            <div class="contact-row" id="usernameGroup">
                                <span class="contact-label">Username</span>
                                <div class="contact-value">
                                    <span id="panelUsername"
                                          class="editable-text"
                                          th:text="${response.userForOwner.username}"></span>
                                    <span class="field-error" id="usernameError"></span>
                                </div>
                                <button class="edit-trigger"
                                        id="usernameEditBtn"
                                        type="button"
                                        aria-label="Редактировать username"
                                        data-edit-group="usernameGroup"
                                        data-edit-field="USERNAME">
                                    <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                                </button>
                            </div>

                            <div class="contact-row" id="emailGroup">
                                <span class="contact-label">Email</span>
                                <div class="contact-value">
                                    <span id="panelEmail"
                                          class="editable-text"
                                          th:text="${response.userForOwner.email}"></span>
                                    <span class="field-error" id="emailError"></span>
                                </div>
                                <button class="edit-trigger"
                                        id="emailEditBtn"
                                        type="button"
                                        aria-label="Редактировать email"
                                        data-edit-group="emailGroup"
                                        data-edit-field="EMAIL">
                                    <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                                </button>
                            </div>

                            <div class="contact-row" id="phoneGroup">
                                <span class="contact-label">Телефон</span>
                                <div class="contact-value">
                                <span id="panelPhone"
                                      class="editable-text"
                                      th:text="${response.userForOwner.phone} ?: ''"
                                      th:attr="data-raw-phone=${response.userForOwner.phone} ?: ''"></span>
                                    <span class="detail-value-empty"
                                          id="panelPhoneEmpty"
                                          th:style="${#strings.isEmpty(response.userForOwner.phone)} ? 'display:inline-flex' : 'display:none'"
                                          data-edit-group="phoneGroup"
                                          data-edit-field="PHONE">
                                    <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                                    Добавить номер
                                </span>
                                    <span class="field-error" id="phoneError"></span>
                                </div>
                                <button class="edit-trigger"
                                        id="phoneEditBtn"
                                        type="button"
                                        aria-label="Редактировать телефон"
                                        th:style="${!#strings.isEmpty(response.userForOwner.phone)} ? 'display:inline-flex' : 'display:none'"
                                        data-edit-group="phoneGroup"
                                        data-edit-field="PHONE">
                                    <th:block th:replace="~{fragments/icons :: icon-edit}"></th:block>
                                </button>
                            </div>

                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/modals/profile-modals :: profileModals}"></th:block>

<script th:src="@{/js/pages/page-profile.js}" defer></script>
<script th:src="@{/js/main.js}" defer></script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
