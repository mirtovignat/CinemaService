spring:
  config:
    import:
      - optional:classpath:catalog.yml
      - optional:classpath:messages.yml
      - optional:classpath:search.yml

  thymeleaf:
    cache: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: true
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        type:
          preferred_enum_type: STRING

server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:${minio.endpoint}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:posters}

tmdb:
  api-url: https://api.themoviedb.org/3
  image-url: https://image.tmdb.org/t/p
  access-token: ${TMDB_ACCESS_TOKEN}

app:
  rating:
    top-limit: 4